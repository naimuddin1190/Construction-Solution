<!DOCTYPE html>
<html lang="bn" data-theme="light" data-accent="gold" data-fs="m">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Construction Calculator — ছাদ ঢালাই, কলাম, দেওয়াল গাঁথুনি, প্লাস্টার ও রডের হিসাব। Roof casting, column, brick wall, plaster and steel estimates.">
    <meta name="theme-color" content="#0f1218">
    <title>Construction Calculator</title>
    <link rel="icon" href="LOGO%201.png">

    <!-- Apply saved settings before first paint (prevents a light/dark flash) -->
    <script>
        (function () {
            var d = document.documentElement, s = {};
            try { s = JSON.parse(localStorage.getItem('cc.settings') || '{}') || {}; } catch (e) {}
            var theme = s.theme || 'system';
            if (theme === 'system') theme = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            d.setAttribute('data-theme', theme);
            d.setAttribute('data-accent', s.accent || 'gold');
            d.setAttribute('data-fs', s.fontSize || 'm');
            d.setAttribute('lang', s.lang || 'bn');
            if (s.compact) d.setAttribute('data-sidebar', 'compact');
            if (s.motion) d.setAttribute('data-motion', 'reduce');
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* =========================================================
           Design tokens
           ========================================================= */
        :root {
            --side-w: 17rem;
            --side-w-compact: 5.25rem;
            --top-h: 4rem;
            --radius: 1rem;
            --radius-sm: .625rem;
            --font: 'Poppins', 'Hind Siliguri', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --font-bn: 'Hind Siliguri', 'Poppins', system-ui, sans-serif;
            --err: #dc2626;
            --side-bg: #0f1218;
            --side-ink: #cfd5df;
            --side-muted: #7d8696;
            --side-hover: rgba(255, 255, 255, .06);
            --side-line: rgba(255, 255, 255, .07);
            --hero-bg: #0f1218;
        }
        :root, [data-theme="light"] {
            color-scheme: light;
            --bg: #f4f5f7;
            --surface: #ffffff;
            --surface-2: #f7f8fa;
            --ink: #141821;
            --ink-2: #2b3240;
            --muted: #667085;
            --line: #e5e7eb;
            --line-2: #d3d7de;
            --err-bg: #fef2f2;
            --top-bg: rgba(244, 245, 247, .85);
            --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 8px 24px rgba(16, 24, 40, .06);
            --shadow-lg: 0 20px 48px rgba(16, 24, 40, .16);
            --brand-ink: var(--brand-700);
            --total-bg: #141821;
            --total-ink: #ffffff;
            --total-muted: #c3c9d4;
        }
        [data-theme="dark"] {
            color-scheme: dark;
            --bg: #0b0d12;
            --surface: #141821;
            --surface-2: #1a1f29;
            --ink: #e8ebf0;
            --ink-2: #c9cfd9;
            --muted: #8d96a7;
            --line: #252b36;
            --line-2: #353d4a;
            --err-bg: rgba(220, 38, 38, .14);
            --top-bg: rgba(11, 13, 18, .85);
            --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
            --shadow-lg: 0 20px 48px rgba(0, 0, 0, .55);
            --brand-ink: var(--brand);
            --total-bg: rgba(var(--brand-rgb), .12);
            --total-ink: var(--ink);
            --total-muted: var(--muted);
            --side-bg: #08090d;
            --hero-bg: #08090d;
        }

        /* Accent colours (Settings → Accent colour) */
        :root, [data-accent="gold"] { --brand: #d9a33a; --brand-rgb: 217, 163, 58;  --brand-600: #b9852a; --brand-700: #8a5a00; --on-brand: #141821; }
        [data-accent="blue"]        { --brand: #3b82f6; --brand-rgb: 59, 130, 246;  --brand-600: #2563eb; --brand-700: #1d4ed8; --on-brand: #ffffff; }
        [data-accent="green"]       { --brand: #16a34a; --brand-rgb: 22, 163, 74;   --brand-600: #15803d; --brand-700: #166534; --on-brand: #ffffff; }
        [data-accent="orange"]      { --brand: #f97316; --brand-rgb: 249, 115, 22;  --brand-600: #ea580c; --brand-700: #c2410c; --on-brand: #ffffff; }
        [data-accent="purple"]      { --brand: #8b5cf6; --brand-rgb: 139, 92, 246;  --brand-600: #7c3aed; --brand-700: #6d28d9; --on-brand: #ffffff; }
        :root { --brand-50: rgba(var(--brand-rgb), .10); --brand-100: rgba(var(--brand-rgb), .28); }

        /* Text size (Settings → Text size) */
        html { font-size: 100%; -webkit-text-size-adjust: 100%; }
        html[data-fs="s"] { font-size: 93.75%; }
        html[data-fs="l"] { font-size: 112.5%; }

        /* =========================================================
           Base
           ========================================================= */
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            transition: background-color .25s, color .25s;
        }
        html[lang="bn"] body { font-family: var(--font-bn); }
        img { max-width: 100%; display: block; }
        a { color: inherit; text-decoration: none; }
        button, input, select, textarea { font: inherit; color: inherit; }
        .container { width: 100%; max-width: 75rem; margin: 0 auto; padding: 0 1.5rem; }
        :focus-visible { outline: 3px solid rgba(var(--brand-rgb), .6); outline-offset: 2px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
        body.lock { overflow: hidden; }

        /* =========================================================
           Sidebar
           ========================================================= */
        .sidebar {
            position: fixed; inset: 0 auto 0 0; z-index: 60;
            width: var(--side-w);
            background: var(--side-bg); color: var(--side-ink);
            display: flex; flex-direction: column;
            border-right: 1px solid var(--side-line);
            transition: width .22s ease, transform .25s ease;
        }
        .side-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: 1rem 1rem .75rem 1.125rem; min-height: var(--top-h); }
        .brand { display: flex; align-items: center; gap: .75rem; min-width: 0; color: #fff; }
        .brand-logo { width: 2.75rem; height: 2.75rem; flex: none; border-radius: .75rem; overflow: hidden; display: grid; place-items: center; background: rgba(255, 255, 255, .04); }
        .brand-logo img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.55); }
        .brand-logo i { display: none; color: var(--brand); font-size: 1.15rem; }
        .brand-logo.no-img i { display: block; }
        .brand-text { min-width: 0; }
        .brand-text strong { display: block; font-size: .95rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .brand-text small { display: block; font-size: .75rem; color: var(--side-muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar .side-close { display: none; }

        .icon-btn {
            width: 2.5rem; height: 2.5rem; flex: none;
            display: inline-grid; place-items: center;
            border-radius: .625rem; border: 1px solid var(--line);
            background: var(--surface); color: var(--ink-2);
            cursor: pointer; font-size: 1rem;
            transition: background .2s, color .2s, border-color .2s;
        }
        .icon-btn:hover { border-color: var(--line-2); color: var(--brand-ink); }
        .sidebar .icon-btn { background: transparent; border-color: var(--side-line); color: var(--side-ink); }
        .sidebar .icon-btn:hover { background: var(--side-hover); color: #fff; }

        .side-search { padding: .25rem 1rem .75rem; }
        .side-nav { flex: 1; overflow-y: auto; padding: .25rem .75rem 1rem; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
        .side-group + .side-group { margin-top: 1rem; }
        .side-group-label { margin: 0 .75rem .375rem; font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--side-muted); white-space: nowrap; }
        .side-link {
            position: relative;
            display: flex; align-items: center; gap: .875rem;
            padding: .625rem .75rem; border-radius: .625rem;
            color: var(--side-ink); font-size: .9375rem; font-weight: 500;
            transition: background .15s, color .15s;
            white-space: nowrap;
            width: 100%; background: none; border: 0; cursor: pointer; text-align: left;
        }
        .side-link i { width: 1.25rem; text-align: center; font-size: 1rem; color: var(--side-muted); transition: color .15s; flex: none; }
        .side-link:hover { background: var(--side-hover); color: #fff; }
        .side-link:hover i { color: #fff; }
        .side-link.active { background: rgba(var(--brand-rgb), .14); color: #fff; }
        .side-link.active i { color: var(--brand); }
        .side-link.active::before { content: ""; position: absolute; left: -.75rem; top: .5rem; bottom: .5rem; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand); }
        .side-label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .side-badge { font-size: .625rem; font-weight: 600; padding: .125rem .5rem; border-radius: 999px; background: rgba(255, 255, 255, .1); color: var(--side-ink); }
        .side-foot { padding: .75rem; border-top: 1px solid var(--side-line); }

        /* compact (icon-only) sidebar, desktop only */
        @media (min-width: 1024px) {
            [data-sidebar="compact"] .sidebar { width: var(--side-w-compact); }
            [data-sidebar="compact"] .brand-text,
            [data-sidebar="compact"] .side-search,
            [data-sidebar="compact"] .side-label,
            [data-sidebar="compact"] .side-badge { display: none; }
            [data-sidebar="compact"] .side-head { flex-direction: column; padding: 1rem .75rem .5rem; }
            [data-sidebar="compact"] .side-group-label { font-size: 0; height: 1px; margin: .5rem .75rem; background: var(--side-line); }
            [data-sidebar="compact"] .side-link { justify-content: center; padding: .75rem; }
            [data-sidebar="compact"] .side-link::after {
                content: attr(data-tip);
                position: absolute; left: calc(100% + .75rem); top: 50%; transform: translateY(-50%);
                background: var(--ink); color: var(--surface);
                font-size: .8125rem; padding: .375rem .625rem; border-radius: .375rem;
                white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 5;
            }
            [data-sidebar="compact"] .side-link:hover::after,
            [data-sidebar="compact"] .side-link:focus-visible::after { opacity: 1; }
            [data-sidebar="compact"] .main { margin-left: var(--side-w-compact); }
        }

        .side-scrim { position: fixed; inset: 0; z-index: 55; background: rgba(5, 7, 10, .55); opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }

        @media (max-width: 1023.98px) {
            .sidebar { transform: translateX(-100%); width: min(var(--side-w), 86vw); box-shadow: none; }
            .sidebar.open { transform: none; box-shadow: 24px 0 48px rgba(0, 0, 0, .35); }
            .side-scrim.show { opacity: 1; visibility: visible; }
            .sidebar .side-close { display: inline-grid; }
            .collapse-btn { display: none !important; }
        }

        /* =========================================================
           Main area & topbar
           ========================================================= */
        .main { margin-left: var(--side-w); min-height: 100vh; display: flex; flex-direction: column; transition: margin-left .22s ease; }
        @media (max-width: 1023.98px) { .main { margin-left: 0; } }
        main { flex: 1; }

        .topbar {
            position: sticky; top: 0; z-index: 40;
            height: var(--top-h);
            display: flex; align-items: center; gap: .75rem;
            padding: 0 1.5rem;
            background: var(--top-bg);
            backdrop-filter: saturate(160%) blur(12px);
            -webkit-backdrop-filter: saturate(160%) blur(12px);
            border-bottom: 1px solid var(--line);
        }
        .menu-btn { display: none; }
        @media (max-width: 1023.98px) { .menu-btn { display: inline-grid; } }
        .top-title { min-width: 0; flex: 1; }
        .top-crumb { display: flex; align-items: center; gap: .5rem; font-size: .8125rem; color: var(--muted); line-height: 1.2; }
        .top-crumb i { font-size: .5rem; }
        .top-crumb a:hover { color: var(--brand-ink); }
        .top-title h2 { margin: 0; font-size: 1.0625rem; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top-actions { display: flex; align-items: center; gap: .5rem; }
        .lang-btn { width: auto; padding: 0 .875rem; font-weight: 600; font-size: .875rem; gap: .5rem; display: inline-flex; align-items: center; }
        @media (max-width: 560px) {
            .topbar { padding: 0 1rem; gap: .5rem; }
            .top-crumb { display: none; }
            .lang-btn .lang-icon { display: none; }
            .lang-btn { padding: 0 .75rem; }
        }

        /* =========================================================
           Pages
           ========================================================= */
        .page { display: none; }
        .page.active { display: block; animation: fade .35s ease; }
        @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
            padding: .75rem 1.375rem; min-height: 3rem; border-radius: .75rem;
            font-weight: 600; font-size: .9375rem; border: 1px solid transparent;
            cursor: pointer; text-align: center;
            transition: background .2s, border-color .2s, color .2s;
        }
        .btn-primary { background: var(--brand); color: var(--on-brand); }
        .btn-primary:hover { background: var(--brand-600); }
        .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink-2); }
        .btn-ghost:hover { background: var(--surface-2); border-color: var(--line-2); }
        .btn-dark { background: var(--ink); color: var(--surface); }
        .btn-dark:hover { opacity: .9; }
        .btn-outline-light { border-color: rgba(255, 255, 255, .25); color: #fff; }
        .btn-outline-light:hover { background: rgba(255, 255, 255, .08); }
        .btn-danger { background: transparent; border-color: rgba(220, 38, 38, .35); color: var(--err); }
        .btn-danger:hover { background: var(--err-bg); }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .btn-block { width: 100%; }
        .btn-sm { min-height: 2.5rem; padding: .5rem 1rem; font-size: .875rem; }

        /* Search (sidebar + hero) */
        .search { position: relative; }
        .search-box { display: flex; align-items: center; gap: .625rem; border-radius: .75rem; padding: .375rem .375rem .375rem 1rem; }
        .search-box > i { color: var(--muted); }
        .search-box input { flex: 1; border: 0; outline: 0; padding: .5rem 0; font-size: 1rem; min-width: 0; background: transparent; }
        .search--hero { max-width: 34rem; }
        .search--hero .search-box { background: #fff; color: #141821; box-shadow: var(--shadow-lg); border-radius: .875rem; }
        .search--hero .search-box > i { color: #667085; }
        .search--hero .search-box input::placeholder { color: #8a93a3; }
        .search--side .search-box { background: rgba(255, 255, 255, .06); border: 1px solid var(--side-line); padding: .25rem .75rem; }
        .search--side .search-box > i { color: var(--side-muted); font-size: .875rem; }
        .search--side .search-box input { color: #fff; font-size: .875rem; }
        .search--side .search-box input::placeholder { color: var(--side-muted); }
        .search-results {
            position: absolute; top: calc(100% + .5rem); left: 0; right: 0; z-index: 20;
            background: var(--surface); color: var(--ink);
            border: 1px solid var(--line); border-radius: .875rem; box-shadow: var(--shadow-lg);
            padding: .375rem; display: none;
        }
        .search-results.show { display: block; }
        .search-results a { display: flex; gap: .75rem; align-items: center; padding: .625rem .75rem; border-radius: .625rem; }
        .search-results a:hover, .search-results a:focus { background: var(--brand-50); outline: none; }
        .search-results strong { display: block; font-size: .9rem; font-weight: 600; line-height: 1.3; }
        .search-empty { padding: .75rem; color: var(--muted); font-size: .875rem; }

        .menu-icon { width: 2.375rem; height: 2.375rem; flex: none; border-radius: .625rem; display: grid; place-items: center; background: var(--brand-50); color: var(--brand-ink); }
        .badge { display: inline-block; font-size: .6875rem; font-weight: 600; padding: .125rem .5rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); vertical-align: middle; }

        /* =========================================================
           Home
           ========================================================= */
        .hero { position: relative; color: #fff; isolation: isolate; background: var(--hero-bg) url('INDEX COVER.png') center / cover no-repeat; }
        .hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, rgba(15, 18, 24, .95) 0%, rgba(15, 18, 24, .85) 45%, rgba(15, 18, 24, .5) 100%); }
        .hero-inner { padding: 4.5rem 1.5rem 7.5rem; max-width: 75rem; margin: 0 auto; }
        .eyebrow { display: inline-flex; align-items: center; gap: .5rem; padding: .375rem .875rem; border-radius: 999px; background: rgba(var(--brand-rgb), .16); color: var(--brand); font-size: .8125rem; font-weight: 600; border: 1px solid rgba(var(--brand-rgb), .35); }
        .hero h1 { font-size: clamp(2rem, 4.6vw, 3.4rem); line-height: 1.15; margin: 1.125rem 0 .875rem; font-weight: 700; max-width: 48rem; letter-spacing: -.02em; }
        .hero h1 span { color: var(--brand); }
        .hero .lead { font-size: clamp(1rem, 1.5vw, 1.15rem); color: #c9cfd9; max-width: 38rem; margin: 0 0 1.75rem; }
        .hero-actions { display: flex; flex-wrap: wrap; gap: .625rem; margin-top: 1.625rem; }
        .chip-link { display: inline-flex; align-items: center; gap: .5rem; padding: .625rem 1rem; border-radius: 999px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); color: #fff; font-size: .9375rem; transition: background .2s, color .2s, border-color .2s; }
        .chip-link i { color: var(--brand); transition: color .2s; }
        .chip-link:hover { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
        .chip-link:hover i { color: var(--on-brand); }

        .stats { position: relative; z-index: 2; margin-top: -3.25rem; }
        .stats-inner { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-lg); }
        .stat { background: var(--surface); padding: 1.375rem; display: flex; gap: .875rem; align-items: center; }
        .stat .menu-icon { width: 2.75rem; height: 2.75rem; font-size: 1.1rem; border-radius: .75rem; }
        .stat strong { display: block; font-size: .9375rem; line-height: 1.3; }
        .stat small { display: block; color: var(--muted); font-size: .8125rem; }
        @media (max-width: 1100px) { .stats-inner { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 480px) { .stat { padding: 1rem; gap: .625rem; } .stat .menu-icon { width: 2.25rem; height: 2.25rem; font-size: .95rem; } .stat strong { font-size: .875rem; } }

        .section { padding: 4.5rem 0; }
        .section-head { text-align: center; max-width: 42rem; margin: 0 auto 2.5rem; }
        .section-head h2 { font-size: clamp(1.6rem, 3vw, 2.25rem); margin: .5rem 0; line-height: 1.25; letter-spacing: -.01em; }
        .section-head p { color: var(--muted); margin: 0; }
        .kicker { color: var(--brand-ink); font-weight: 600; font-size: .8125rem; letter-spacing: .08em; text-transform: uppercase; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 1.25rem; }
        .tool-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem; display: flex; flex-direction: column; gap: .75rem; transition: transform .2s, box-shadow .2s, border-color .2s; }
        .tool-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--brand-100); }
        .tool-card .menu-icon { width: 3.125rem; height: 3.125rem; font-size: 1.25rem; border-radius: .875rem; }
        .tool-card h3 { margin: 0; font-size: 1.125rem; line-height: 1.35; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
        .tool-card p { margin: 0; color: var(--muted); font-size: .9rem; flex: 1; }
        .tool-card .go { color: var(--brand-ink); font-weight: 600; font-size: .875rem; display: inline-flex; gap: .375rem; align-items: center; }
        .tool-card.soon { background: var(--surface-2); }

        .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
        .feature { padding: 1.75rem; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
        .feature .menu-icon { width: 3rem; height: 3rem; font-size: 1.25rem; border-radius: .875rem; margin-bottom: 1rem; }
        .feature h3 { margin: 0 0 .375rem; font-size: 1.125rem; }
        .feature p { margin: 0; color: var(--muted); font-size: .9375rem; }
        @media (max-width: 860px) { .features { grid-template-columns: 1fr; } }

        .cta-band { background: #0f1218 radial-gradient(circle at 100% 0%, rgba(var(--brand-rgb), .25), transparent 55%); color: #fff; border-radius: 1.5rem; padding: 3rem; display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.75rem; align-items: center; border: 1px solid var(--line); }
        .cta-band h2 { margin: 0 0 .5rem; font-size: clamp(1.5rem, 3vw, 2rem); line-height: 1.3; }
        .cta-band p { margin: 0; color: #c3c9d4; }
        .cta-actions { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: flex-end; }
        @media (max-width: 860px) { .cta-band { grid-template-columns: 1fr; padding: 2rem 1.5rem; } .cta-actions { justify-content: flex-start; } }

        /* =========================================================
           Inner page header
           ========================================================= */
        .page-hero {
            color: #fff; padding: 2.5rem 0 6.5rem;
            background-color: var(--hero-bg);
            background-image:
                radial-gradient(circle at 85% 0%, rgba(var(--brand-rgb), .24), transparent 45%),
                linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
            background-size: auto, 2rem 2rem, 2rem 2rem;
        }
        .page-hero .ph-icon { width: 3rem; height: 3rem; border-radius: .875rem; display: grid; place-items: center; background: rgba(var(--brand-rgb), .16); color: var(--brand); font-size: 1.25rem; margin-bottom: 1rem; }
        .page-hero h1 { font-size: clamp(1.6rem, 3.4vw, 2.5rem); margin: 0 0 .375rem; line-height: 1.25; letter-spacing: -.01em; }
        .page-hero p { color: #c3c9d4; margin: 0; max-width: 44rem; }
        .page-body { margin-top: -4rem; padding-bottom: 4.5rem; position: relative; }

        /* =========================================================
           Cards & calculator
           ========================================================= */
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
        .card-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: 1.125rem 1.5rem; border-bottom: 1px solid var(--line); }
        .card-head h2 { margin: 0; font-size: 1.0625rem; display: flex; align-items: center; gap: .625rem; }
        .card-head h2 i { color: var(--brand-ink); }
        .card-body { padding: 1.5rem; }

        .calc-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 1.5rem; align-items: start; }
        .result-card { position: sticky; top: calc(var(--top-h) + 1.25rem); scroll-margin-top: calc(var(--top-h) + 1rem); }

        .group-title { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 .75rem; display: flex; align-items: center; gap: .625rem; }
        html[lang="bn"] .group-title { text-transform: none; letter-spacing: 0; font-size: .875rem; }
        .group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
        .fieldset + .fieldset { margin-top: 1.5rem; }

        .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
        .fields.auto { grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); }
        .fields.ratio { grid-template-columns: repeat(auto-fit, minmax(5.25rem, 1fr)); gap: .75rem; }
        .field > label, .field-label { display: block; font-size: .875rem; font-weight: 500; color: var(--ink-2); margin-bottom: .375rem; }
        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-wrap input {
            width: 100%; height: 3rem; padding: 0 3.75rem 0 .875rem;
            border: 1px solid var(--line); border-radius: var(--radius-sm);
            background: var(--surface-2); font-size: 1rem;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }
        .input-wrap.plain input { padding-right: .875rem; }
        .input-wrap input::placeholder { color: var(--muted); opacity: .7; }
        .input-wrap input:focus { outline: 0; border-color: var(--brand); background: var(--surface); box-shadow: 0 0 0 4px rgba(var(--brand-rgb), .18); }
        .unit { position: absolute; right: .875rem; font-size: .8125rem; color: var(--muted); pointer-events: none; font-weight: 500; }
        .field.invalid input { border-color: var(--err); background: var(--err-bg); }
        .field-error { display: none; color: var(--err); font-size: .78rem; margin-top: .3rem; line-height: 1.4; }
        .field.invalid .field-error { display: block; }

        .segmented { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .25rem; gap: .25rem; min-height: 3rem; }
        .segmented label { flex: 1; margin: 0; position: relative; display: flex; }
        .segmented input { position: absolute; opacity: 0; pointer-events: none; }
        .segmented label > span { flex: 1; display: flex; align-items: center; justify-content: center; gap: .375rem; padding: .375rem .5rem; border-radius: .4375rem; font-size: .875rem; font-weight: 500; cursor: pointer; color: var(--muted); transition: background .15s, color .15s; text-align: center; line-height: 1.25; }
        .segmented label > span:hover { color: var(--ink); }
        .segmented input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
        [data-theme="dark"] .segmented input:checked + span { background: var(--line-2); }
        .segmented input:focus-visible + span { outline: 3px solid rgba(var(--brand-rgb), .6); }

        .form-actions { display: flex; gap: .75rem; margin-top: 1.75rem; }
        .form-actions .btn-primary { flex: 1; }
        .hint { font-size: .85rem; color: var(--muted); margin: 1.125rem 0 0; display: flex; gap: .625rem; align-items: flex-start; padding: .75rem .875rem; background: var(--surface-2); border-radius: var(--radius-sm); }
        .hint i { color: var(--brand-ink); margin-top: .25rem; }

        /* Results */
        .empty { text-align: center; padding: 2.25rem .75rem; color: var(--muted); }
        .empty-icon { width: 4rem; height: 4rem; margin: 0 auto .875rem; border-radius: 50%; display: grid; place-items: center; background: var(--brand-50); color: var(--brand-ink); font-size: 1.5rem; }
        .empty p { margin: 0; }
        .result-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
        .result-row { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding: .7rem .875rem; border-radius: var(--radius-sm); background: var(--surface-2); font-size: .9rem; border: 1px solid transparent; }
        .result-row .label { color: var(--ink-2); }
        .result-row .value { font-weight: 600; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
        .result-row .value small { font-weight: 500; color: var(--muted); margin-left: .25rem; font-size: .78rem; }
        .result-row.key { background: var(--brand-50); border-color: var(--brand-100); }
        .result-row.key .label { font-weight: 600; font-size: .95rem; color: var(--ink); }
        .result-row.key .value { font-size: 1.125rem; color: var(--brand-ink); }
        .result-sub { margin-top: 1.375rem; }
        .total-box { margin-top: .75rem; padding: 1.125rem; border-radius: .875rem; background: var(--total-bg); color: var(--total-ink); border: 1px solid var(--brand-100); display: flex; justify-content: space-between; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; }
        .total-box .label { color: var(--total-muted); font-weight: 600; font-size: 1rem; }
        .total-box .value { font-size: 1.5rem; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
        .total-box .value small { font-size: .875rem; color: var(--total-muted); font-weight: 500; margin-left: .25rem; }
        .result-actions { margin-top: 1.25rem; }

        @media (max-width: 1100px) {
            .calc-grid { grid-template-columns: 1fr; }
            .result-card { position: static; }
        }
        @media (max-width: 560px) {
            .container { padding: 0 1rem; }
            .fields { grid-template-columns: 1fr; }
            .fields.ratio { grid-template-columns: repeat(auto-fit, minmax(4.5rem, 1fr)); }
            .card-body { padding: 1.125rem; }
            .card-head { padding: 1rem 1.125rem; }
            .form-actions { flex-direction: column-reverse; }
            .hero-inner { padding: 3rem 1rem 6.5rem; }
            .section { padding: 3.5rem 0; }
        }
        @media (max-width: 380px) {
            .result-row { flex-direction: column; align-items: flex-start; gap: .125rem; }
            .result-row .value { text-align: left; white-space: normal; }
        }

        /* =========================================================
           About / Contact
           ========================================================= */
        .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 1.5rem; align-items: start; }
        @media (max-width: 1100px) { .two-col { grid-template-columns: 1fr; } }
        .profile { text-align: center; }
        .avatar { width: 5.75rem; height: 5.75rem; border-radius: 50%; margin: 0 auto .875rem; background: linear-gradient(135deg, var(--brand), var(--brand-700)); color: #fff; display: grid; place-items: center; font-size: 1.875rem; font-weight: 700; box-shadow: 0 10px 24px rgba(var(--brand-rgb), .35); }
        .profile h3 { margin: 0; font-size: 1.2rem; font-family: var(--font); }
        .profile .role { color: var(--muted); margin: .25rem 0 0; font-size: .9rem; }
        .profile .about-text { color: var(--ink-2); font-size: .9375rem; margin: 1.125rem 0 0; text-align: left; }
        .info-list { list-style: none; padding: 0; margin: 1.25rem 0 0; display: grid; gap: .625rem; text-align: left; }
        .info-list li { display: flex; gap: .75rem; align-items: center; padding: .75rem .875rem; background: var(--surface-2); border-radius: var(--radius-sm); }
        .info-list .menu-icon { width: 2.25rem; height: 2.25rem; }
        .info-list small { display: block; color: var(--muted); font-size: .78rem; line-height: 1.3; }
        .info-list a, .info-list .v { font-weight: 500; word-break: break-word; }
        .info-list a:hover { color: var(--brand-ink); }

        .form-grid { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
        .form-grid .full { grid-column: 1 / -1; }
        @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
        .control { width: 100%; min-height: 3rem; padding: .75rem .875rem; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); font-size: 1rem; transition: border-color .15s, box-shadow .15s, background .15s; }
        .control:focus { outline: 0; border-color: var(--brand); background: var(--surface); box-shadow: 0 0 0 4px rgba(var(--brand-rgb), .18); }
        textarea.control { resize: vertical; min-height: 8rem; }

        .contact-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; margin-bottom: 1.5rem; }
        @media (max-width: 900px) { .contact-cards { grid-template-columns: 1fr; } }
        .contact-card { display: flex; gap: .875rem; align-items: center; padding: 1.25rem 1.375rem; transition: transform .2s, box-shadow .2s; }
        .contact-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .contact-card .menu-icon { width: 3rem; height: 3rem; font-size: 1.2rem; border-radius: .875rem; }
        .contact-card small { display: block; color: var(--muted); font-size: .8125rem; }
        .contact-card strong { display: block; font-size: .9375rem; word-break: break-word; }
        .review-wrap { max-width: 47.5rem; margin: 0 auto; }

        .rating { display: flex; align-items: center; gap: .875rem; flex-wrap: wrap; }
        .stars { display: inline-flex; flex-direction: row-reverse; gap: .25rem; position: relative; }
        .stars input { position: absolute; opacity: 0; width: 0; height: 0; }
        .stars label { font-size: 1.75rem; color: var(--line-2); cursor: pointer; transition: color .15s, transform .15s; line-height: 1; padding: .125rem; }
        .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color: var(--brand); }
        .stars label:hover { transform: scale(1.12); }
        .stars input:focus-visible + label { outline: 3px solid rgba(var(--brand-rgb), .6); border-radius: .375rem; }
        .rating-text { font-size: .875rem; color: var(--muted); font-weight: 500; }

        .soon-card { max-width: 36rem; margin: 0 auto; text-align: center; padding: 3rem 1.75rem; }
        .soon-card .empty-icon { width: 5rem; height: 5rem; font-size: 1.875rem; animation: pulse 2s ease-in-out infinite; }
        .soon-card h2 { margin: 0 0 .5rem; font-size: 1.5rem; }
        .soon-card p { color: var(--muted); margin: 0 0 1.5rem; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--brand-rgb), .35); } 50% { box-shadow: 0 0 0 16px rgba(var(--brand-rgb), 0); } }

        /* Footer */
        .site-footer { border-top: 1px solid var(--line); padding: 1.5rem 0; color: var(--muted); font-size: .875rem; background: var(--surface); }
        .footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .socials { display: flex; gap: .5rem; }
        .socials a { width: 2.375rem; height: 2.375rem; border-radius: .625rem; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); transition: background .2s, color .2s, border-color .2s; }
        .socials a:hover { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
        @media (max-width: 700px) { .footer-inner { flex-direction: column; text-align: center; } }

        /* =========================================================
           Settings drawer
           ========================================================= */
        .scrim { position: fixed; inset: 0; z-index: 70; background: rgba(5, 7, 10, .55); backdrop-filter: blur(2px); opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }
        .scrim.show { opacity: 1; visibility: visible; }
        .drawer {
            position: fixed; top: 0; right: 0; bottom: 0; z-index: 80;
            width: min(27rem, 100%);
            background: var(--surface); color: var(--ink);
            display: flex; flex-direction: column;
            box-shadow: var(--shadow-lg); border-left: 1px solid var(--line);
            transform: translateX(105%); visibility: hidden;
            transition: transform .28s ease, visibility .28s;
        }
        .drawer.open { transform: none; visibility: visible; }
        .drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--line); }
        .drawer-head h2 { margin: 0; font-size: 1.25rem; display: flex; align-items: center; gap: .625rem; }
        .drawer-head h2 i { color: var(--brand-ink); }
        .drawer-head p { margin: .25rem 0 0; color: var(--muted); font-size: .875rem; }
        .drawer-body { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem 1.5rem; }
        .drawer-foot { padding: 1rem 1.5rem; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: .625rem; }
        .drawer-foot .note { grid-column: 1 / -1; margin: 0; font-size: .78rem; color: var(--muted); text-align: center; }
        .set-group + .set-group { margin-top: 1.75rem; }
        .set-block + .set-block { margin-top: 1.125rem; }
        .set-block .field-label { margin-bottom: .5rem; }
        .set-block .segmented { min-height: 2.75rem; }
        .set-help { display: block; font-size: .78rem; color: var(--muted); margin-top: .375rem; }
        .set-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .875rem 0; }
        .set-row + .set-row { border-top: 1px solid var(--line); }
        .set-row strong { display: block; font-size: .9375rem; font-weight: 500; }
        .set-row small { display: block; font-size: .8rem; color: var(--muted); }

        .swatches { display: flex; flex-wrap: wrap; gap: .625rem; }
        .swatch { position: relative; }
        .swatch input { position: absolute; opacity: 0; pointer-events: none; }
        .swatch span { width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: #fff; font-size: .875rem; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .08); transition: transform .15s; }
        .swatch span i { opacity: 0; transition: opacity .15s; }
        .swatch input:checked + span { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--sw); }
        .swatch input:checked + span i { opacity: 1; }
        .swatch input:focus-visible + span { outline: 3px solid rgba(var(--brand-rgb), .6); outline-offset: 4px; }
        .swatch span:hover { transform: scale(1.08); }

        .switch { appearance: none; -webkit-appearance: none; width: 2.75rem; height: 1.5rem; border-radius: 999px; background: var(--line-2); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .2s; }
        .switch::before { content: ""; position: absolute; top: .1875rem; left: .1875rem; width: 1.125rem; height: 1.125rem; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
        .switch:checked { background: var(--brand); }
        .switch:checked::before { transform: translateX(1.25rem); }
        .switch:disabled { opacity: .5; cursor: not-allowed; }

        /* Toast */
        .toast { position: fixed; left: 50%; bottom: 1.5rem; z-index: 100; transform: translate(-50%, 20px); background: #141821; color: #fff; padding: .875rem 1.125rem; border-radius: .75rem; box-shadow: var(--shadow-lg); display: flex; gap: .625rem; align-items: center; max-width: calc(100% - 2rem); width: max-content; opacity: 0; visibility: hidden; transition: opacity .25s, transform .25s, visibility .25s; }
        .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
        .toast i { color: #4ade80; }

        /* Reduce animations (Settings) + OS preference */
        [data-motion="reduce"] *, [data-motion="reduce"] *::before, [data-motion="reduce"] *::after { animation: none !important; transition: none !important; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
        }

        /* =========================================================
           Print
           ========================================================= */
        .print-only { display: none; }
        @media print {
            @page { margin: 14mm; }
            :root { --surface: #fff; --surface-2: #f6f6f6; --ink: #111; --ink-2: #222; --muted: #555; --line: #ddd; --brand-ink: #6b4a00; --total-bg: #f3f3f3; --total-ink: #111; --total-muted: #444; }
            body { background: #fff; color: #111; }
            .sidebar, .side-scrim, .topbar, .site-footer, .page-hero, .form-card, .no-print, .toast, .drawer, .scrim { display: none !important; }
            .main { margin: 0 !important; }
            .page.active { animation: none; }
            .page-body { margin: 0; padding: 0; }
            .container { max-width: none; padding: 0; }
            .calc-grid { display: block; }
            .card { box-shadow: none; border: 0; background: #fff; }
            .card-head { padding: 0 0 .625rem; }
            .card-body { padding: .875rem 0 0; }
            .print-only { display: block; }
            .print-head { margin-bottom: .875rem; }
            .print-head strong { display: block; font-size: 1.25rem; }
            .print-head span { color: #555; font-size: .8125rem; }
            .print-inputs { margin: 0 0 1rem; padding: .625rem .875rem; border: 1px solid #ddd; border-radius: .5rem; font-size: .8125rem; columns: 2; }
            .print-inputs div { break-inside: avoid; }
            .result-row, .total-box { break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .total-box .value { color: #111; }
        }
    </style>
</head>
<body>

<!-- ================= Sidebar ================= -->
<aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="side-head">
        <a href="#home" class="brand">
            <span class="brand-logo" id="brand-logo">
                <img src="LOGO%201.png" alt="" width="44" height="44" onerror="this.parentNode.classList.add('no-img');this.remove()">
                <i class="fa-solid fa-helmet-safety"></i>
            </span>
            <span class="brand-text">
                <strong data-i18n="brand.name"></strong>
                <small data-i18n="brand.tag"></small>
            </span>
        </a>
        <button class="icon-btn side-close" id="side-close" type="button" data-i18n-aria="a11y.closeMenu"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="side-search">
        <div class="search search--side" data-search>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" data-i18n-ph="search.ph" data-i18n-aria="search.ph" autocomplete="off">
            </div>
            <div class="search-results" role="listbox"></div>
        </div>
    </div>

    <nav class="side-nav" aria-label="Main">
        <div class="side-group">
            <p class="side-group-label" data-i18n="nav.main"></p>
            <a class="side-link" href="#home" data-link="home"><i class="fa-solid fa-house"></i><span class="side-label" data-i18n="page.home"></span></a>
        </div>
        <div class="side-group">
            <p class="side-group-label" data-i18n="nav.calculators"></p>
            <a class="side-link" href="#roof" data-link="roof"><i class="fa-solid fa-layer-group"></i><span class="side-label" data-i18n="page.roof"></span></a>
            <a class="side-link" href="#column" data-link="column"><i class="fa-solid fa-building-columns"></i><span class="side-label" data-i18n="page.column"></span></a>
            <a class="side-link" href="#wall" data-link="wall"><i class="fa-solid fa-trowel-bricks"></i><span class="side-label" data-i18n="page.wall"></span></a>
            <a class="side-link" href="#plaster" data-link="plaster"><i class="fa-solid fa-paint-roller"></i><span class="side-label" data-i18n="page.plaster"></span></a>
            <a class="side-link" href="#steel" data-link="steel"><i class="fa-solid fa-grip-lines"></i><span class="side-label" data-i18n="page.steel"></span></a>
            <a class="side-link" href="#tiles" data-link="tiles"><i class="fa-solid fa-table-cells-large"></i><span class="side-label" data-i18n="page.tiles"></span><span class="side-badge" data-i18n="badge.soon"></span></a>
        </div>
        <div class="side-group">
            <p class="side-group-label" data-i18n="nav.more"></p>
            <a class="side-link" href="#about" data-link="about"><i class="fa-solid fa-circle-info"></i><span class="side-label" data-i18n="page.about"></span></a>
            <a class="side-link" href="#contact" data-link="contact"><i class="fa-solid fa-envelope"></i><span class="side-label" data-i18n="page.contact"></span></a>
        </div>
    </nav>

    <div class="side-foot">
        <button class="side-link" type="button" data-open-settings><i class="fa-solid fa-gear"></i><span class="side-label" data-i18n="set.title"></span></button>
        <button class="side-link collapse-btn" type="button" id="collapse-btn"><i class="fa-solid fa-angles-left" id="collapse-icon"></i><span class="side-label" data-i18n="nav.collapse"></span></button>
    </div>
</aside>
<div class="side-scrim" id="side-scrim"></div>

<!-- ================= Main ================= -->
<div class="main">
    <header class="topbar">
