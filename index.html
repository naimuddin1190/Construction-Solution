<!-- ================= Settings drawer ================= -->
<div class="scrim" id="settings-scrim"></div>
<section class="drawer" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" tabindex="-1">
    <div class="drawer-head">
        <div>
            <h2 id="settings-title"><i class="fa-solid fa-gear"></i> <span data-i18n="set.title"></span></h2>
            <p data-i18n="set.sub"></p>
        </div>
        <button class="icon-btn" type="button" id="settings-close" data-i18n-aria="set.close"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <form class="drawer-body" id="settings-form" onsubmit="return false">
        <div class="set-group">
            <p class="group-title" data-i18n="set.appearance"></p>

            <div class="set-block">
                <span class="field-label" id="lbl-theme" data-i18n="set.theme"></span>
                <div class="segmented" role="radiogroup" aria-labelledby="lbl-theme">
                    <label><input type="radio" name="theme" value="light"><span><i class="fa-solid fa-sun"></i><b data-i18n="theme.light" style="font-weight:inherit"></b></span></label>
                    <label><input type="radio" name="theme" value="dark"><span><i class="fa-solid fa-moon"></i><b data-i18n="theme.dark" style="font-weight:inherit"></b></span></label>
                    <label><input type="radio" name="theme" value="system"><span><i class="fa-solid fa-desktop"></i><b data-i18n="theme.system" style="font-weight:inherit"></b></span></label>
                </div>
            </div>

            <div class="set-block">
                <span class="field-label" id="lbl-accent" data-i18n="set.accent"></span>
                <div class="swatches" role="radiogroup" aria-labelledby="lbl-accent">
                    <label class="swatch" data-i18n-title="accent.teal"><input type="radio" name="accent" value="teal"><span style="background:linear-gradient(135deg,#0d9488,#0d9488cc);--sw:#0d9488"><i class="fa-solid fa-check"></i></span></label>
                    <label class="swatch" data-i18n-title="accent.gold"><input type="radio" name="accent" value="gold"><span style="background:linear-gradient(135deg,#d4a03a,#d4a03acc);--sw:#d4a03a"><i class="fa-solid fa-check"></i></span></label>
                    <label class="swatch" data-i18n-title="accent.blue"><input type="radio" name="accent" value="blue"><span style="background:linear-gradient(135deg,#3b82f6,#3b82f6cc);--sw:#3b82f6"><i class="fa-solid fa-check"></i></span></label>
                    <label class="swatch" data-i18n-title="accent.purple"><input type="radio" name="accent" value="purple"><span style="background:linear-gradient(135deg,#8b5cf6,#8b5cf6cc);--sw:#8b5cf6"><i class="fa-solid fa-check"></i></span></label>
                    <label class="swatch" data-i18n-title="accent.orange"><input type="radio" name="accent" value="orange"><span style="background:linear-gradient(135deg,#f97316,#f97316cc);--sw:#f97316"><i class="fa-solid fa-check"></i></span></label>
                    <label class="swatch" data-i18n-title="accent.rose"><input type="radio" name="accent" value="rose"><span style="background:linear-gradient(135deg,#f43f5e,#f43f5ecc);--sw:#f43f5e"><i class="fa-solid fa-check"></i></span></label>
                </div>
            </div>

            <div class="set-block">
                <span class="field-label" id="lbl-fs" data-i18n="set.fontSize"></span>
                <div class="segmented" role="radiogroup" aria-labelledby="lbl-fs">
                    <label><input type="radio" name="fontSize" value="s"><span data-i18n="fs.s"></span></label>
                    <label><input type="radio" name="fontSize" value="m"><span data-i18n="fs.m"></span></label>
                    <label><input type="radio" name="fontSize" value="l"><span data-i18n="fs.l"></span></label>
                </div>
            </div>
        </div>

        <div class="set-group">
            <p class="group-title" data-i18n="set.langNum"></p>

            <div class="set-block">
                <span class="field-label" id="lbl-lang" data-i18n="set.lang"></span>
                <div class="segmented" role="radiogroup" aria-labelledby="lbl-lang">
                    <label><input type="radio" name="lang" value="bn"><span>বাংলা</span></label>
                    <label><input type="radio" name="lang" value="en"><span>English</span></label>
                </div>
            </div>

            <div class="set-block">
                <span class="field-label" id="lbl-digits" data-i18n="set.digits"></span>
                <div class="segmented" role="radiogroup" aria-labelledby="lbl-digits">
                    <label><input type="radio" name="digits" value="auto"><span data-i18n="digits.auto"></span></label>
                    <label><input type="radio" name="digits" value="en"><span>123</span></label>
                    <label><input type="radio" name="digits" value="bn"><span>১২৩</span></label>
                </div>
                <small class="set-help" data-i18n="set.digits.hint"></small>
            </div>

            <div class="set-block">
                <span class="field-label" id="lbl-dec" data-i18n="set.decimals"></span>
                <div class="segmented" role="radiogroup" aria-labelledby="lbl-dec">
                    <label><input type="radio" name="decimals" value="0"><span data-dg="0"></span></label>
                    <label><input type="radio" name="decimals" value="1"><span data-dg="0.0"></span></label>
                    <label><input type="radio" name="decimals" value="2"><span data-dg="0.00"></span></label>
                    <label><input type="radio" name="decimals" value="3"><span data-dg="0.000"></span></label>
                </div>
            </div>
        </div>

        <div class="set-group">
            <p class="group-title" data-i18n="set.behavior"></p>
            <label class="set-row">
                <span><strong data-i18n="set.remember"></strong><small data-i18n="set.remember.d"></small></span>
                <input type="checkbox" class="switch" role="switch" name="remember">
            </label>
            <label class="set-row">
                <span><strong data-i18n="set.compact"></strong><small data-i18n="set.compact.d"></small></span>
                <input type="checkbox" class="switch" role="switch" name="compact">
            </label>
            <label class="set-row">
                <span><strong data-i18n="set.motion"></strong><small data-i18n="set.motion.d"></small></span>
                <input type="checkbox" class="switch" role="switch" name="motion">
            </label>
        </div>
    </form>

    <div class="drawer-foot">
        <button type="button" class="btn btn-ghost btn-sm" id="clear-inputs"><i class="fa-solid fa-eraser"></i> <span data-i18n="set.clear"></span></button>
        <button type="button" class="btn btn-danger btn-sm" id="reset-settings"><i class="fa-solid fa-rotate-left"></i> <span data-i18n="set.reset"></span></button>
        <p class="note" data-i18n="set.note"></p>
    </div>
</section>

<!-- ================= Admin login ================= -->
<div class="scrim" id="login-scrim"></div>
<section class="modal" id="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <div class="modal-head">
        <span class="modal-icon"><i class="fa-solid fa-user-shield"></i></span>
        <div>
            <h2 id="login-title" data-i18n="admin.loginTitle"></h2>
            <p data-i18n="admin.loginSub"></p>
        </div>
        <button class="icon-btn" type="button" id="login-close" data-i18n-aria="set.close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form class="modal-body" id="login-form" novalidate>
        <p class="hint" id="fb-missing" hidden><i class="fa-solid fa-plug-circle-exclamation"></i><span data-i18n="admin.noFirebase"></span></p>
        <div class="field">
            <label for="login-email" data-i18n="admin.email"></label>
            <input class="control" type="email" id="login-email" name="email" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="login-pass" data-i18n="admin.password"></label>
            <div class="pass-wrap">
                <input class="control" type="password" id="login-pass" name="password" autocomplete="current-password" required>
                <button type="button" class="pass-toggle" id="pass-toggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
            </div>
        </div>
        <p class="form-error" id="login-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit"><i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="admin.signIn"></span></button>
        <button type="button" class="link-btn" id="forgot-btn" data-i18n="admin.forgot"></button>
    </form>
</section>

<!-- ================= Account (Gmail) ================= -->
<div class="scrim" id="acct-scrim"></div>
<section class="modal modal-wide" id="acct-modal" role="dialog" aria-modal="true" aria-labelledby="acct-title">
    <div class="modal-head">
        <span class="modal-icon"><i class="fa-solid fa-circle-user"></i></span>
        <div>
            <h2 id="acct-title" data-i18n="acct.title"></h2>
            <p id="acct-sub" data-i18n="acct.sub"></p>
        </div>
        <button class="icon-btn" type="button" id="acct-close" data-i18n-aria="set.close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <!-- signed out -->
    <div class="modal-body" id="acct-out">
        <p class="hint" data-fb-missing hidden><i class="fa-solid fa-plug-circle-exclamation"></i><span data-i18n="admin.noFirebase"></span></p>
        <button type="button" class="btn btn-google btn-block" id="google-btn"><span class="g-mark" aria-hidden="true">G</span> <span data-i18n="acct.google"></span></button>
        <div class="or-line"><span data-i18n="acct.or"></span></div>
        <div class="segmented acct-mode" role="radiogroup">
            <label><input type="radio" name="acctMode" value="in" checked><span data-i18n="acct.signIn"></span></label>
            <label><input type="radio" name="acctMode" value="up"><span data-i18n="acct.signUp"></span></label>
        </div>
        <form id="acct-form" class="acct-form" novalidate>
            <div class="field" data-up-only hidden>
                <label for="acct-name" data-i18n="acct.name"></label>
                <input class="control" id="acct-name" autocomplete="name" maxlength="60">
            </div>
            <div class="field">
                <label for="acct-email" data-i18n="acct.gmail"></label>
                <input class="control" type="email" id="acct-email" autocomplete="email" placeholder="yourname@gmail.com" maxlength="120">
            </div>
            <div class="field">
                <label for="acct-pass" data-i18n="admin.password"></label>
                <div class="pass-wrap">
                    <input class="control" type="password" id="acct-pass" autocomplete="current-password" maxlength="100">
                    <button type="button" class="pass-toggle" data-pass-toggle="acct-pass" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                </div>
                <small class="set-help" data-up-only hidden data-i18n="acct.passHint"></small>
            </div>
            <p class="form-error" id="acct-error" role="alert"></p>
            <button type="submit" class="btn btn-primary btn-block" id="acct-submit"><i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="acct.signIn"></span></button>
            <button type="button" class="link-btn" id="acct-forgot" data-i18n="admin.forgot"></button>
        </form>
        <small class="set-help acct-note" data-i18n="acct.note"></small>
    </div>
    <!-- signed in -->
    <div class="modal-body" id="acct-in" hidden>
        <div class="acct-card">
            <span class="acct-avatar" id="acct-avatar"></span>
            <span class="acct-who"><strong id="acct-name-out"></strong><small id="acct-email-out"></small></span>
            <span class="plan-chip" id="acct-plan"></span>
        </div>
        <div class="acct-status" id="acct-status"></div>
        <button type="button" class="btn btn-pro btn-block" data-buy-pro><i class="fa-solid fa-crown"></i> <span id="acct-buy-label"></span></button>
        <a href="#plan" class="btn btn-soft btn-block" id="acct-open-plan"><i class="fa-solid fa-compass-drafting"></i> <span data-i18n="acct.openPlan"></span></a>
        <div class="acct-pays">
            <p class="group-title" data-i18n="acct.history"></p>
            <div id="acct-pays"></div>
        </div>
        <button type="button" class="btn btn-ghost btn-block" id="acct-logout"><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="admin.logout"></span></button>
    </div>
</section>

<div class="scrim" id="buy-scrim"></div>
<section class="modal modal-wide" id="buy-modal" role="dialog" aria-modal="true" aria-labelledby="buy-title">
    <div class="modal-head">
        <span class="modal-icon pro-icon"><i class="fa-solid fa-crown"></i></span>
        <div>
            <h2 id="buy-title" data-i18n="buy.title"></h2>
            <p data-i18n="buy.sub"></p>
        </div>
        <button class="icon-btn" type="button" id="buy-close" data-i18n-aria="set.close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form class="modal-body" id="buy-form" novalidate>
        <p class="hint warn" id="buy-pending" hidden><i class="fa-solid fa-hourglass-half"></i><span></span></p>
        <div>
            <p class="group-title" data-i18n="buy.step1"></p>
            <div class="plan-pick" id="buy-plans"></div>
        </div>
        <div id="buy-pay">
            <p class="group-title" data-i18n="buy.step2"></p>
            <div class="method-pick" id="buy-methods" role="radiogroup"></div>
            <div class="pay-box" id="buy-box"></div>
        </div>
        <div id="buy-fields">
            <p class="group-title" data-i18n="buy.step3"></p>

                <div class="field"><label for="buy-sender" id="buy-sender-label" data-i18n="buy.sender"></label><input class="control" id="buy-sender" inputmode="tel" maxlength="40" autocomplete="off"><span class="field-error"></span></div>

        <button type="submit" class="btn btn-pro btn-block" id="buy-submit"><i class="fa-solid fa-paper-plane"></i> <span data-i18n="buy.submit"></span></button>
        <small class="set-help" data-i18n="buy.note"></small>
        <p class="hint" id="buy-none" hidden><i class="fa-solid fa-circle-info"></i><span data-i18n="buy.none"></span></p>
    </form>
</section>
