<!DOCTYPE html>
<html lang="bn" data-theme="light" data-accent="teal" data-fs="m">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Construction Solution — ছাদ ঢালাই, কলাম, দেওয়াল গাঁথুনি, প্লাস্টার ও রডের হিসাব। Roof casting, column, brick wall, plaster and steel estimates.">
    <meta name="theme-color" content="#eef2f5">
    <title>Construction Solution</title>
    <link rel="icon" id="favicon" href="data:,">

    <!-- Apply settings before first paint (admin site defaults + visitor choices) -->
    <script>
        (function () {
            var d = document.documentElement, user = {}, site = {};
            try { user = JSON.parse(localStorage.getItem('cc.settings') || '{}') || {}; } catch (e) {}
            try { site = JSON.parse(localStorage.getItem('cc.site') || '{}') || {}; } catch (e) {}
            var def = site.defaults || {};
            if (site.allowUserSettings === false) user = {};
            function get(k, f) { return user[k] != null ? user[k] : (def[k] != null ? def[k] : f); }
            var theme = get('theme', 'system');
            if (theme === 'system') theme = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            d.setAttribute('data-theme', theme);
            d.setAttribute('data-accent', get('accent', 'teal'));
            d.setAttribute('data-fs', get('fontSize', 'm'));
            d.setAttribute('lang', get('lang', 'bn'));
            if (get('compact', false)) d.setAttribute('data-sidebar', 'compact');
            if (get('motion', false)) d.setAttribute('data-motion', 'reduce');
            if (site.favicon) document.getElementById('favicon').href = site.favicon;
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* =========================================================
           Design tokens — soft, eye-comfort palette + glass surfaces
           ========================================================= */
        :root {
            --side-w: 16.5rem;
            --side-w-compact: 4.75rem;
            --top-h: 3.75rem;
            --gap: .875rem;
            --radius: 1.25rem;
            --radius-sm: .75rem;
            --font: 'Poppins', 'Noto Sans Bengali', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --font-bn: 'Noto Sans Bengali', 'Poppins', system-ui, sans-serif;
            --err: #e5484d;
            --blur: blur(18px) saturate(160%);
        }
        :root, [data-theme="light"] {
            color-scheme: light;
            --bg: #eef2f5;
            --blob-1: rgba(var(--brand-rgb), .22);
            --blob-2: rgba(125, 211, 252, .30);
            --blob-3: rgba(251, 207, 232, .34);
            --blob-4: rgba(187, 247, 208, .34);
            --glass: rgba(255, 255, 255, .58);
            --glass-strong: rgba(255, 255, 255, .78);
            --glass-border: rgba(255, 255, 255, .9);
            --field: rgba(255, 255, 255, .72);
            --field-focus: #ffffff;
            --seg-on: #ffffff;
            --ink: #1e293b;
            --ink-2: #334155;
            --muted: #64748b;
            --line: rgba(30, 41, 59, .08);
            --line-2: rgba(30, 41, 59, .15);
            --err-bg: rgba(229, 72, 77, .08);
            --shadow: 0 1px 2px rgba(30, 41, 59, .04), 0 10px 30px rgba(30, 41, 59, .07);
            --shadow-lg: 0 24px 60px rgba(30, 41, 59, .14);
            --brand-ink: var(--brand-700);
            --hero-overlay: linear-gradient(115deg, rgba(238, 242, 245, .55), rgba(var(--brand-rgb), .28));
        }
        [data-theme="dark"] {
            color-scheme: dark;
            --bg: #162032;
            --blob-1: rgba(var(--brand-rgb), .22);
            --blob-2: rgba(56, 189, 248, .14);
            --blob-3: rgba(167, 139, 250, .15);
            --blob-4: rgba(45, 212, 191, .10);
            --glass: rgba(30, 41, 59, .55);
            --glass-strong: rgba(30, 41, 59, .80);
            --glass-border: rgba(148, 163, 184, .16);
            --field: rgba(15, 23, 42, .35);
            --field-focus: rgba(15, 23, 42, .55);
            --seg-on: rgba(148, 163, 184, .22);
            --ink: #e2e8f0;
            --ink-2: #cbd5e1;
            --muted: #94a3b8;
            --line: rgba(148, 163, 184, .14);
            --line-2: rgba(148, 163, 184, .26);
            --err-bg: rgba(229, 72, 77, .14);
            --shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 10px 30px rgba(0, 0, 0, .22);
            --shadow-lg: 0 24px 60px rgba(0, 0, 0, .38);
            --brand-ink: var(--brand-light);
            --hero-overlay: linear-gradient(115deg, rgba(22, 32, 50, .35), rgba(var(--brand-rgb), .30));
        }

        /* Accent colours (Settings → Accent colour) */
        :root, [data-accent="teal"] { --brand: #0d9488; --brand-rgb: 13, 148, 136;  --brand-600: #0f766e; --brand-700: #115e59; --brand-light: #5eead4; --on-brand: #ffffff; }
        [data-accent="gold"]        { --brand: #d4a03a; --brand-rgb: 212, 160, 58;  --brand-600: #b8862a; --brand-700: #85590a; --brand-light: #f2c46d; --on-brand: #1e293b; }
        [data-accent="blue"]        { --brand: #3b82f6; --brand-rgb: 59, 130, 246;  --brand-600: #2563eb; --brand-700: #1d4ed8; --brand-light: #93c5fd; --on-brand: #ffffff; }
        [data-accent="purple"]      { --brand: #8b5cf6; --brand-rgb: 139, 92, 246;  --brand-600: #7c3aed; --brand-700: #6d28d9; --brand-light: #c4b5fd; --on-brand: #ffffff; }
        [data-accent="orange"]      { --brand: #f97316; --brand-rgb: 249, 115, 22;  --brand-600: #ea580c; --brand-700: #c2410c; --brand-light: #fdba74; --on-brand: #ffffff; }
        [data-accent="rose"]        { --brand: #f43f5e; --brand-rgb: 244, 63, 94;   --brand-600: #e11d48; --brand-700: #be123c; --brand-light: #fda4af; --on-brand: #ffffff; }
        :root {
            --brand-50: rgba(var(--brand-rgb), .12);
            --brand-100: rgba(var(--brand-rgb), .28);
            --brand-grad: linear-gradient(135deg, var(--brand), var(--brand-600));
            --brand-shadow: 0 10px 24px rgba(var(--brand-rgb), .30);
        }

        /* Text size (Settings → Text size) */
        html { font-size: 100%; -webkit-text-size-adjust: 100%; }
        html[data-fs="s"] { font-size: 93.75%; }
        html[data-fs="l"] { font-size: 112.5%; }

        /* =========================================================
           Base
           ========================================================= */
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            transition: background-color .3s, color .3s;
        }
        /* soft colour mesh behind the glass */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background:
                radial-gradient(42rem 32rem at 0% 0%, var(--blob-1), transparent 62%),
                radial-gradient(38rem 30rem at 100% 0%, var(--blob-2), transparent 62%),
                radial-gradient(42rem 32rem at 100% 100%, var(--blob-3), transparent 62%),
                radial-gradient(38rem 30rem at 0% 100%, var(--blob-4), transparent 62%);
        }
        html[lang="bn"] body { font-family: var(--font-bn); line-height: 1.7; }
        img { max-width: 100%; display: block; }
        img[width="1"][height="1"] { display: inline !important; max-width: none !important; }   /* html2canvas measures the text baseline with this 1×1 image */
        a { color: inherit; text-decoration: none; }
        button, input, select, textarea { font: inherit; color: inherit; }
        .container { width: 100%; max-width: 75rem; margin: 0 auto; padding: 0 1rem; }
        :focus-visible { outline: 3px solid rgba(var(--brand-rgb), .55); outline-offset: 2px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
        body.lock { overflow: hidden; }
        [hidden] { display: none !important; }
        body[data-page="admin"] .wa-float { display: none !important; }
        ::selection { background: rgba(var(--brand-rgb), .25); }

        /* Glass surface */
        .glass, .card, .sidebar, .topbar, .tool-card, .feature, .stat, .drawer, .search-results, .hero-glass, .cta-band, .toast, .site-footer {
            background: var(--glass);
            -webkit-backdrop-filter: var(--blur);
            backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
        }

        /* =========================================================
           Sidebar (floating glass panel)
           ========================================================= */
        .sidebar {
            position: fixed; top: var(--gap); bottom: var(--gap); left: var(--gap); z-index: 60;
            width: var(--side-w);
            border-radius: var(--radius);
            background: var(--glass-strong);
            color: var(--ink-2);
            display: flex; flex-direction: column; overflow: hidden;
            transition: width .25s ease, transform .3s ease;
        }
        .side-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: 1rem 1rem .75rem; }
        .brand { display: flex; align-items: center; gap: .75rem; min-width: 0; color: var(--ink); }
        .brand-logo { width: 2.75rem; height: 2.75rem; flex: none; border-radius: .875rem; overflow: hidden; display: grid; place-items: center; background: var(--brand-grad); box-shadow: var(--brand-shadow); }
        .brand-logo img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.55); }
        .brand-logo i { display: none; color: var(--on-brand); font-size: 1.15rem; }
        .brand-logo.no-img i { display: block; }
        .brand-text { min-width: 0; }
        .brand-text strong { display: block; font-size: .95rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .brand-text small { display: block; font-size: .75rem; color: var(--muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .icon-btn {
            width: 2.5rem; height: 2.5rem; flex: none;
            display: inline-grid; place-items: center;
            border-radius: .75rem; border: 1px solid var(--line);
            background: var(--field); color: var(--ink-2);
            cursor: pointer; font-size: 1rem;
            transition: background .2s, color .2s, border-color .2s, transform .2s;
        }
        .icon-btn:hover { border-color: var(--brand-100); color: var(--brand-ink); background: var(--brand-50); }
        .icon-btn:active { transform: scale(.96); }
        .sidebar .side-close { display: none; }

        .side-search { padding: .25rem 1rem .75rem; }
        .side-nav { flex: 1; overflow-y: auto; padding: .25rem .75rem 1rem; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
        .side-group + .side-group { margin-top: 1rem; }
        .side-group-label { margin: 0 .75rem .375rem; font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
        html[lang="bn"] .side-group-label { letter-spacing: 0; font-size: .78rem; }
        .side-link {
            position: relative;
            display: flex; align-items: center; gap: .875rem;
            padding: .625rem .75rem; border-radius: .75rem;
            color: var(--ink-2); font-size: .9375rem; font-weight: 500;
            transition: background .15s, color .15s, box-shadow .15s;
            white-space: nowrap;
            width: 100%; background: none; border: 0; cursor: pointer; text-align: left;
        }
        .side-link + .side-link { margin-top: .125rem; }
        .side-link i { width: 1.25rem; text-align: center; font-size: 1rem; color: var(--muted); transition: color .15s; flex: none; }
        .side-link:hover { background: var(--brand-50); color: var(--ink); }
        .side-link:hover i { color: var(--brand-ink); }
        .side-link.active { background: var(--brand-grad); color: var(--on-brand); box-shadow: var(--brand-shadow); }
        .side-link.active i { color: var(--on-brand); }
        .side-label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .side-badge { font-size: .625rem; font-weight: 600; padding: .125rem .5rem; border-radius: 999px; background: var(--brand-50); color: var(--brand-ink); border: 1px solid var(--brand-100); }
        .side-link.active .side-badge { background: rgba(255, 255, 255, .25); color: var(--on-brand); border-color: transparent; }
        .side-foot { padding: .75rem; border-top: 1px solid var(--line); }

        /* compact (icon-only) sidebar — desktop */
        @media (min-width: 1024px) {
            [data-sidebar="compact"] .sidebar { width: var(--side-w-compact); }
            [data-sidebar="compact"] .brand-text,
            [data-sidebar="compact"] .side-search,
            [data-sidebar="compact"] .side-label,
            [data-sidebar="compact"] .side-badge { display: none; }
            [data-sidebar="compact"] .side-head { justify-content: center; padding: 1rem .5rem .75rem; }
            [data-sidebar="compact"] .side-group-label,
            html[lang="bn"][data-sidebar="compact"] .side-group-label { font-size: 0 !important; line-height: 0; height: 1px; padding: 0; margin: .625rem .5rem; background: var(--line-2); overflow: hidden; color: transparent; }
            [data-sidebar="compact"] .side-nav { overflow: visible; }
            [data-sidebar="compact"] .sidebar { overflow: visible; }
            [data-sidebar="compact"] .side-link { justify-content: center; padding: .75rem; }
            [data-sidebar="compact"] .side-link::after {
                content: attr(data-tip);
                position: absolute; left: calc(100% + .875rem); top: 50%; transform: translate(-4px, -50%);
                background: var(--ink); color: var(--bg);
                font-size: .8125rem; padding: .375rem .625rem; border-radius: .5rem;
                white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s, transform .15s; z-index: 5;
                box-shadow: var(--shadow-lg);
            }
            [data-sidebar="compact"] .side-link:hover::after,
            [data-sidebar="compact"] .side-link:focus-visible::after { opacity: 1; transform: translate(0, -50%); }
            [data-sidebar="compact"] .main { margin-left: calc(var(--side-w-compact) + var(--gap) * 2); }
        }

        .side-scrim { position: fixed; inset: 0; z-index: 55; background: rgba(15, 23, 42, .28); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }

        @media (max-width: 1023.98px) {
            .sidebar { width: min(var(--side-w), calc(100vw - 3rem)); transform: translateX(calc(-100% - 2rem)); }
            .sidebar.open { transform: none; box-shadow: var(--shadow-lg); }
            .side-scrim.show { opacity: 1; visibility: visible; }
            .sidebar .side-close { display: inline-grid; }
        }

        /* =========================================================
           Main area & topbar
           ========================================================= */
        .main {
            margin-left: calc(var(--side-w) + var(--gap) * 2);
            padding: var(--gap) var(--gap) 0 0;
            min-height: 100vh; display: flex; flex-direction: column;
            transition: margin-left .25s ease;
        }
        @media (max-width: 1023.98px) { .main { margin-left: 0; padding: var(--gap) var(--gap) 0; } }
        main { flex: 1; }

        .topbar {
            position: sticky; top: var(--gap); z-index: 40;
            height: var(--top-h);
            display: flex; align-items: center; gap: .75rem;
            padding: 0 .75rem;
            border-radius: var(--radius);
            background: var(--glass-strong);
        }
        .top-title { min-width: 0; flex: 1; }
        .top-crumb { display: flex; align-items: center; gap: .5rem; font-size: .78rem; color: var(--muted); line-height: 1.2; }
        .top-crumb i { font-size: .5rem; }
        .top-crumb a:hover { color: var(--brand-ink); }
        .top-title h2 { margin: 0; font-size: 1.0625rem; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top-actions { display: flex; align-items: center; gap: .5rem; }
        .lang-btn { width: auto; padding: 0 .875rem; font-weight: 600; font-size: .875rem; gap: .5rem; display: inline-flex; align-items: center; }
        @media (max-width: 560px) {
            .topbar { gap: .5rem; padding: 0 .5rem; }
            .top-crumb { display: none; }
            .lang-btn .lang-icon { display: none; }
            .lang-btn { padding: 0 .75rem; }
        }

        /* hamburger → X animation */
        .burger-icon { width: 1.125rem; height: .875rem; position: relative; display: block; }
        .burger-icon span { position: absolute; left: 0; height: 2px; width: 100%; border-radius: 2px; background: currentColor; transition: transform .25s, opacity .2s, width .25s, top .25s; }
        .burger-icon span:nth-child(1) { top: 0; }
        .burger-icon span:nth-child(2) { top: calc(50% - 1px); width: 70%; }
        .burger-icon span:nth-child(3) { top: calc(100% - 2px); }
        /* desktop: middle bar grows when the sidebar is collapsed */
        .menu-btn[aria-expanded="false"] .burger-icon span:nth-child(2) { width: 100%; }
        @media (max-width: 1023.98px) {
            .menu-btn[aria-expanded="true"] .burger-icon span:nth-child(1) { top: calc(50% - 1px); transform: rotate(45deg); }
            .menu-btn[aria-expanded="true"] .burger-icon span:nth-child(2) { opacity: 0; }
            .menu-btn[aria-expanded="true"] .burger-icon span:nth-child(3) { top: calc(50% - 1px); transform: rotate(-45deg); }
        }

        /* =========================================================
           Pages
           ========================================================= */
        .page { display: none; }
        .page.active { display: block; animation: fade .4s ease; }
        @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
            padding: .75rem 1.375rem; min-height: 3rem; border-radius: .875rem;
            font-weight: 600; font-size: .9375rem; border: 1px solid transparent;
            cursor: pointer; text-align: center;
            transition: background .2s, border-color .2s, color .2s, transform .2s, box-shadow .2s, filter .2s;
        }
        .btn:active:not(:disabled) { transform: translateY(1px) scale(.99); }
        .btn-primary { background: var(--brand-grad); color: var(--on-brand); box-shadow: var(--brand-shadow); }
        .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
        .btn-ghost { background: var(--field); border-color: var(--line-2); color: var(--ink-2); }
        .btn-ghost:hover { border-color: var(--brand-100); color: var(--brand-ink); }
        .btn-soft { background: var(--brand-50); border-color: var(--brand-100); color: var(--brand-ink); }
        .btn-soft:hover:not(:disabled) { background: var(--brand-grad); color: var(--on-brand); border-color: transparent; }
        .btn-danger { background: transparent; border-color: rgba(229, 72, 77, .35); color: var(--err); }
        .btn-danger:hover { background: var(--err-bg); }
        .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
        .btn-block { width: 100%; }
        .btn-sm { min-height: 2.5rem; padding: .5rem 1rem; font-size: .875rem; }

        /* Search (sidebar + hero) */
        .search { position: relative; }
        .search-box { display: flex; align-items: center; gap: .625rem; border-radius: .875rem; padding: .375rem .375rem .375rem 1rem; background: var(--field); border: 1px solid var(--line-2); transition: border-color .15s, box-shadow .15s; }
        .search-box:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(var(--brand-rgb), .15); }
        .search-box > i { color: var(--muted); }
        .search-box input { flex: 1; border: 0; outline: 0; padding: .5rem 0; font-size: 1rem; min-width: 0; background: transparent; }
        .search-box input::placeholder { color: var(--muted); }
        .search--hero { max-width: 34rem; }
        .search--side .search-box { padding: .25rem .75rem; }
        .search--side .search-box > i { font-size: .875rem; }
        .search--side .search-box input { font-size: .875rem; }
        .search-results {
            position: absolute; top: calc(100% + .5rem); left: 0; right: 0; z-index: 20;
            background: var(--glass-strong); color: var(--ink);
            border-radius: .875rem; box-shadow: var(--shadow-lg);
            padding: .375rem; display: none;
        }
        .search-results.show { display: block; }
        .search-results a { display: flex; gap: .75rem; align-items: center; padding: .5rem .625rem; border-radius: .625rem; }
        .search-results a:hover, .search-results a:focus { background: var(--brand-50); outline: none; }
        .search-results strong { display: block; font-size: .9rem; font-weight: 600; line-height: 1.3; }
        .search-empty { padding: .75rem; color: var(--muted); font-size: .875rem; }

        .menu-icon { width: 2.375rem; height: 2.375rem; flex: none; border-radius: .75rem; display: grid; place-items: center; background: var(--brand-50); color: var(--brand-ink); }
        .badge { display: inline-block; font-size: .6875rem; font-weight: 600; padding: .125rem .5rem; border-radius: 999px; background: var(--brand-50); border: 1px solid var(--brand-100); color: var(--brand-ink); vertical-align: middle; }

        /* =========================================================
           Home
           ========================================================= */
        .hero { padding-top: 1.25rem; }
        .hero-card {
            position: relative; isolation: isolate; z-index: 2;
            border-radius: 1.75rem; min-height: 30rem;
            display: flex; align-items: center; padding: 2.5rem;
            background: #c9d6df url('INDEX COVER.png') center / cover no-repeat;
            box-shadow: var(--shadow-lg);
        }
        .hero-card::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--hero-overlay); }
        .hero-glass { flex: 1 1 auto; min-width: 0; max-width: 41rem; padding: 2.25rem; border-radius: 1.5rem; background: var(--glass-strong); }
        .eyebrow { display: inline-flex; align-items: center; gap: .5rem; padding: .375rem .875rem; border-radius: 999px; background: var(--brand-50); color: var(--brand-ink); font-size: .8125rem; font-weight: 600; border: 1px solid var(--brand-100); }
        .hero h1 { font-size: clamp(1.9rem, 4.2vw, 3.1rem); line-height: 1.15; margin: 1rem 0 .75rem; font-weight: 700; letter-spacing: -.02em; }
        .hero h1 span { background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
        [data-theme="dark"] .hero h1 span { background: linear-gradient(135deg, var(--brand-light), var(--brand)); -webkit-background-clip: text; background-clip: text; }
        .hero .lead { font-size: clamp(1rem, 1.4vw, 1.1rem); color: var(--ink-2); margin: 0 0 1.5rem; }

        @media (max-width: 640px) {

        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); margin-top: var(--gap); }

        @media (max-width: 1100px) { .stats { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 480px) { .stat { padding: .875rem; gap: .625rem; } .stat .menu-icon { width: 2.25rem; height: 2.25rem; font-size: .95rem; } .stat strong { font-size: .85rem; } }

        .section { padding: 4rem 0 0; }
        .section-head { text-align: center; max-width: 42rem; margin: 0 auto 2.25rem; }
        .section-head h2 { font-size: clamp(1.5rem, 2.8vw, 2.125rem); margin: .5rem 0; line-height: 1.25; letter-spacing: -.01em; }
        .section-head p { color: var(--muted); margin: 0; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: var(--gap); }
        .tool-card { border-radius: var(--radius); padding: 1.5rem; display: flex; flex-direction: column; gap: .75rem; transition: transform .25s, box-shadow .25s, border-color .25s; }
        .tool-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--brand-100); }
        .tool-card .menu-icon { width: 3.125rem; height: 3.125rem; font-size: 1.25rem; border-radius: 1rem; transition: background .25s, color .25s, box-shadow .25s; }
        .tool-card:hover .menu-icon { background: var(--brand-grad); color: var(--on-brand); box-shadow: var(--brand-shadow); }
        .tool-card h3 { margin: 0; font-size: 1.125rem; line-height: 1.35; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
        .tool-card p { margin: 0; color: var(--muted); font-size: .9rem; flex: 1; }

        .tool-card .go i { transition: transform .2s; }

        .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }

        .feature h3 { margin: 0 0 .375rem; font-size: 1.125rem; }
        .feature p { margin: 0; color: var(--muted); font-size: .9375rem; }
        @media (max-width: 860px) { .features { grid-template-columns: 1fr; } }

        .cta-band {
            border-radius: 1.75rem; padding: 2.75rem;
            background: linear-gradient(135deg, rgba(var(--brand-rgb), .18), rgba(var(--brand-rgb), .04)), var(--glass);

            margin-bottom: 1rem;
        }
        .cta-band h2 { margin: 0 0 .5rem; font-size: clamp(1.4rem, 2.8vw, 1.9rem); line-height: 1.3; }
        .cta-band p { margin: 0; color: var(--ink-2); }
        .cta-actions { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: flex-end; }
        @media (max-width: 860px) { .cta-band { grid-template-columns: 1fr; padding: 1.75rem 1.5rem; } .cta-actions { justify-content: flex-start; } }

        /* =========================================================
           Inner page header
           ========================================================= */
        .page-hero { padding: 1.75rem 0 1.25rem; }
        .page-hero .container { display: flex; align-items: center; gap: 1rem; }
        .ph-icon { width: 3.25rem; height: 3.25rem; flex: none; border-radius: 1rem; display: grid; place-items: center; background: var(--brand-grad); color: var(--on-brand); font-size: 1.3rem; box-shadow: var(--brand-shadow); }
        .page-hero h1 { font-size: clamp(1.35rem, 2.8vw, 1.9rem); margin: 0; line-height: 1.3; letter-spacing: -.01em; }
        .page-hero p { color: var(--muted); margin: .25rem 0 0; max-width: 46rem; }
        .page-body { padding-bottom: 1rem; }
        @media (max-width: 560px) { .page-hero .container { align-items: flex-start; } .ph-icon { width: 2.75rem; height: 2.75rem; font-size: 1.1rem; } }

        /* =========================================================
           Cards & calculator
           ========================================================= */
        .card { border-radius: var(--radius); }
        .card-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: 1.125rem 1.5rem; border-bottom: 1px solid var(--line); }
        .card-head h2 { margin: 0; font-size: 1.0625rem; display: flex; align-items: center; gap: .625rem; }
        .card-head h2 i { width: 2rem; height: 2rem; border-radius: .625rem; display: grid; place-items: center; background: var(--brand-50); color: var(--brand-ink); font-size: .875rem; }
        .card-body { padding: 1.5rem; }

        .calc-grid {
            display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr);
            grid-template-areas: "form viz" "form res"; grid-template-rows: auto 1fr;
            gap: var(--gap); align-items: start;
        }
        .form-card { grid-area: form; }
        .viz-card { grid-area: viz; }
        .result-card { grid-area: res; scroll-margin-top: calc(var(--top-h) + var(--gap) * 2); }

        /* 3D preview */
        .viz-card { overflow: hidden; }
        .viz-tools { display: flex; gap: .375rem; }
        .icon-btn-sm { width: 2.125rem; height: 2.125rem; font-size: .85rem; border-radius: .625rem; }
        .icon-btn[aria-pressed="true"] { background: var(--brand-50); color: var(--brand-ink); border-color: var(--brand-100); }
        .viz-stage {
            position: relative; height: 18rem; cursor: grab;
            background:
                radial-gradient(ellipse 70% 60% at 50% 40%, rgba(var(--brand-rgb), .10), transparent 70%),
                linear-gradient(180deg, transparent, rgba(var(--brand-rgb), .05));
        }
        .viz-stage:active { cursor: grabbing; }
        .viz-stage canvas { display: block; width: 100% !important; height: 100% !important; touch-action: pan-y; outline: none; }
        .viz-badge {
            position: absolute; left: .75rem; top: .75rem; z-index: 2; pointer-events: none;
            display: inline-flex; align-items: center; gap: .4rem;
            font-size: .75rem; font-weight: 600; padding: .25rem .7rem; border-radius: 999px;
            background: var(--glass-strong); border: 1px solid var(--line); color: var(--muted);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        }
        .viz-badge.live { color: var(--brand-ink); border-color: var(--brand-100); }
        .viz-badge .dot { width: .45rem; height: .45rem; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 0 rgba(var(--brand-rgb), .6); animation: livePulse 1.8s infinite; }
        @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(var(--brand-rgb), .55); } 70% { box-shadow: 0 0 0 7px rgba(var(--brand-rgb), 0); } 100% { box-shadow: 0 0 0 0 rgba(var(--brand-rgb), 0); } }
        .viz-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 1.5rem; color: var(--muted); font-size: .9rem; }
        .viz-empty i { display: block; font-size: 2rem; margin-bottom: .5rem; color: var(--brand-ink); opacity: .6; }
        .viz-foot { padding: .75rem 1.25rem 1rem; border-top: 1px solid var(--line); display: grid; gap: .5rem; }
        .viz-chips { display: flex; flex-wrap: wrap; gap: .375rem; }
        .viz-chip { font-size: .78rem; padding: .25rem .65rem; border-radius: 999px; background: var(--field); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
        .viz-chip b { color: var(--ink); font-weight: 600; margin-left: .25rem; }
        .viz-chip.warn { color: var(--brand-ink); background: var(--brand-50); border-color: var(--brand-100); white-space: normal; }
        .viz-hint { color: var(--muted); font-size: .75rem; display: flex; align-items: center; gap: .4rem; }

        .group-title { font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin: 0 0 .75rem; display: flex; align-items: center; gap: .625rem; }
        html[lang="bn"] .group-title { text-transform: none; letter-spacing: 0; font-size: .875rem; }
        .group-title::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
        .fieldset + .fieldset { margin-top: 1.5rem; }

        .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
        .fields.auto { grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); }
        .fields.ratio { grid-template-columns: repeat(auto-fit, minmax(5.25rem, 1fr)); gap: .75rem; }
        .field > label, .field-label { display: block; font-size: .875rem; font-weight: 500; color: var(--ink-2); margin-bottom: .375rem; }
        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-wrap input {
            width: 100%; height: 3rem; padding: 0 3.75rem 0 .875rem;
            border: 1px solid var(--line-2); border-radius: var(--radius-sm);
            background: var(--field); font-size: 1rem;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }
        .input-wrap.plain input { padding-right: .875rem; }
        .input-wrap input::placeholder { color: var(--muted); opacity: .6; }
        .input-wrap input:hover { border-color: var(--brand-100); }
        .input-wrap input:focus { outline: 0; border-color: var(--brand); background: var(--field-focus); box-shadow: 0 0 0 4px rgba(var(--brand-rgb), .15); }
        .unit { position: absolute; right: .875rem; font-size: .8125rem; color: var(--muted); pointer-events: none; font-weight: 500; }
        .field.invalid input { border-color: var(--err); background: var(--err-bg); }
        .field-error { display: none; color: var(--err); font-size: .78rem; margin-top: .3rem; line-height: 1.4; }
        .field.invalid .field-error { display: block; }

        .segmented { display: flex; background: var(--field); border: 1px solid var(--line-2); border-radius: var(--radius-sm); padding: .25rem; gap: .25rem; min-height: 3rem; }
        .segmented label { flex: 1; margin: 0; position: relative; display: flex; }
        .segmented input { position: absolute; opacity: 0; pointer-events: none; }
        .segmented label > span { flex: 1; display: flex; align-items: center; justify-content: center; gap: .375rem; padding: .375rem .5rem; border-radius: .5rem; font-size: .875rem; font-weight: 500; cursor: pointer; color: var(--muted); transition: background .15s, color .15s, box-shadow .15s; text-align: center; line-height: 1.25; }
        .segmented label > span:hover { color: var(--ink); }
        .segmented input:checked + span { background: var(--seg-on); color: var(--brand-ink); box-shadow: 0 1px 3px rgba(15, 23, 42, .12); font-weight: 600; }
        .segmented input:focus-visible + span { outline: 3px solid rgba(var(--brand-rgb), .55); }

        .form-actions { display: flex; gap: .75rem; margin-top: 1.75rem; }
        .form-actions .btn-primary { flex: 1; }
        .hint { font-size: .85rem; color: var(--ink-2); margin: 1.125rem 0 0; display: flex; gap: .625rem; align-items: flex-start; padding: .75rem .875rem; background: var(--brand-50); border: 1px dashed var(--brand-100); border-radius: var(--radius-sm); }
        .hint i { color: var(--brand-ink); margin-top: .25rem; }

        /* Results */
        .empty { text-align: center; padding: 2.25rem .75rem; color: var(--muted); }
        .empty-icon { width: 4rem; height: 4rem; margin: 0 auto .875rem; border-radius: 1.25rem; display: grid; place-items: center; background: var(--brand-50); color: var(--brand-ink); font-size: 1.5rem; }
        .empty p { margin: 0; }
        .result-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
        .result-row { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding: .7rem .875rem; border-radius: var(--radius-sm); background: var(--field); font-size: .9rem; border: 1px solid var(--line); }
        .result-row .label { color: var(--ink-2); }

        .result-row .value small { font-weight: 500; color: var(--muted); margin-left: .25rem; font-size: .78rem; }
        .result-row.key { background: var(--brand-50); border-color: var(--brand-100); }
        .result-row.key .label { font-weight: 600; font-size: .95rem; color: var(--ink); }
        .result-row.key .value { font-size: 1.125rem; color: var(--brand-ink); }
        .result-sub { margin-top: 1.375rem; }
        .total-box { margin-top: .75rem; padding: 1.125rem 1.25rem; border-radius: 1rem; background: var(--brand-grad); color: var(--on-brand); box-shadow: var(--brand-shadow); display: flex; justify-content: space-between; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; }
        .total-box .label { font-weight: 600; font-size: 1rem; opacity: .92; }
        .total-box .value { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        .total-box .value small { font-size: .875rem; font-weight: 500; margin-left: .25rem; opacity: .85; }
        .result-actions { margin-top: 1.25rem; }

        @media (max-width: 1100px) {
            .calc-grid { grid-template-columns: 1fr; grid-template-areas: "viz" "form" "res"; grid-template-rows: auto; }
            .viz-stage { height: 16rem; }
        }
        @media (max-width: 560px) {
            .container { padding: 0; }
            .fields { grid-template-columns: 1fr; }
            .fields.ratio { grid-template-columns: repeat(auto-fit, minmax(4.5rem, 1fr)); }
            .card-body { padding: 1.125rem; }
            .card-head { padding: 1rem 1.125rem; }
            .form-actions { flex-direction: column-reverse; }
            .section { padding-top: 3rem; }
        }
        @media (max-width: 380px) {
            .result-row { flex-direction: column; align-items: flex-start; gap: .125rem; }
            .result-row .value { text-align: left; white-space: normal; }
        }

        /* =========================================================
           About / Contact
           ========================================================= */
        .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: var(--gap); align-items: start; }
        @media (max-width: 1100px) { .two-col { grid-template-columns: 1fr; } }
        .profile { text-align: center; }
        .avatar { width: 5.75rem; height: 5.75rem; border-radius: 1.75rem; margin: 0 auto .875rem; background: var(--brand-grad); color: var(--on-brand); display: grid; place-items: center; font-size: 1.875rem; font-weight: 700; box-shadow: var(--brand-shadow); }
        .profile h3 { margin: 0; font-size: 1.2rem; font-family: var(--font); }
        .profile .role { color: var(--muted); margin: .25rem 0 0; font-size: .9rem; }
        .profile .about-text { color: var(--ink-2); font-size: .9375rem; margin: 1.125rem 0 0; text-align: left; }
        .info-list { list-style: none; padding: 0; margin: 1.25rem 0 0; display: grid; gap: .625rem; text-align: left; }
        .info-list li { display: flex; gap: .75rem; align-items: center; padding: .75rem .875rem; background: var(--field); border: 1px solid var(--line); border-radius: var(--radius-sm); }
        .info-list .menu-icon { width: 2.25rem; height: 2.25rem; }
        .info-list small { display: block; color: var(--muted); font-size: .78rem; line-height: 1.3; }
        .info-list a, .info-list .v { font-weight: 500; word-break: break-word; }
        .info-list a:hover { color: var(--brand-ink); }

        .form-grid { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }

        @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
        .control { width: 100%; min-height: 3rem; padding: .75rem .875rem; border: 1px solid var(--line-2); border-radius: var(--radius-sm); background: var(--field); font-size: 1rem; transition: border-color .15s, box-shadow .15s, background .15s; }
        .control:focus { outline: 0; border-color: var(--brand); background: var(--field-focus); box-shadow: 0 0 0 4px rgba(var(--brand-rgb), .15); }
        textarea.control { resize: vertical; min-height: 8rem; }

        .contact-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); margin-bottom: var(--gap); }
        @media (max-width: 900px) { .contact-cards { grid-template-columns: 1fr; } }
        .contact-card { display: flex; gap: .875rem; align-items: center; padding: 1.25rem 1.375rem; transition: transform .25s, box-shadow .25s, border-color .25s; }
        .contact-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--brand-100); }
        .contact-card .menu-icon { width: 3rem; height: 3rem; font-size: 1.2rem; border-radius: 1rem; }
        .contact-card small { display: block; color: var(--muted); font-size: .8125rem; }
        .contact-card strong { display: block; font-size: .9375rem; word-break: break-word; }
        .review-wrap { max-width: 47.5rem; margin: 0 auto; }

        .rating { display: flex; align-items: center; gap: .875rem; flex-wrap: wrap; }
        .stars { display: inline-flex; flex-direction: row-reverse; gap: .25rem; position: relative; }
        .stars input { position: absolute; opacity: 0; width: 0; height: 0; }
        .stars label { font-size: 1.75rem; color: var(--line-2); cursor: pointer; transition: color .15s, transform .15s; line-height: 1; padding: .125rem; }
        .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color: #f5b301; }
        .stars label:hover { transform: scale(1.12); }
        .stars input:focus-visible + label { outline: 3px solid rgba(var(--brand-rgb), .55); border-radius: .375rem; }
        .rating-text { font-size: .875rem; color: var(--muted); font-weight: 500; }

        .soon-card { max-width: 36rem; margin: 0 auto; text-align: center; padding: 3rem 1.75rem; }
        .soon-card .empty-icon { width: 5rem; height: 5rem; font-size: 1.875rem; animation: pulse 2s ease-in-out infinite; }
        .soon-card h2 { margin: 0 0 .5rem; font-size: 1.5rem; }
        .soon-card p { color: var(--muted); margin: 0 0 1.5rem; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--brand-rgb), .35); } 50% { box-shadow: 0 0 0 16px rgba(var(--brand-rgb), 0); } }

        /* Footer */
        .site-footer { border-radius: var(--radius); margin: 2.5rem 0 var(--gap); padding: 1rem 1.25rem; color: var(--muted); font-size: .875rem; }
        .footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 0; max-width: none; }
        .socials { display: flex; gap: .5rem; }
        .socials a { width: 2.375rem; height: 2.375rem; border-radius: .75rem; display: grid; place-items: center; background: var(--field); border: 1px solid var(--line); color: var(--ink-2); transition: background .2s, color .2s, border-color .2s, box-shadow .2s; }
        .socials a:hover { background: var(--brand-grad); border-color: transparent; color: var(--on-brand); box-shadow: var(--brand-shadow); }
        @media (max-width: 760px) { .footer-inner { flex-direction: column; text-align: center; } }

        /* =========================================================
           Settings drawer (floating glass)
           ========================================================= */
        .scrim { position: fixed; inset: 0; z-index: 70; background: rgba(15, 23, 42, .28); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }
        .scrim.show { opacity: 1; visibility: visible; }
        .drawer {
            position: fixed; top: var(--gap); right: var(--gap); bottom: var(--gap); z-index: 80;
            width: min(26.5rem, calc(100% - var(--gap) * 2));
            border-radius: var(--radius);
            background: var(--glass-strong); color: var(--ink);
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: var(--shadow-lg);
            transform: translateX(calc(100% + 2rem)); visibility: hidden;
            transition: transform .3s ease, visibility .3s;
        }
        .drawer.open { transform: none; visibility: visible; }
        .drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--line); }
        .drawer-head h2 { margin: 0; font-size: 1.25rem; display: flex; align-items: center; gap: .625rem; }
        .drawer-head h2 i { width: 2.25rem; height: 2.25rem; border-radius: .75rem; display: grid; place-items: center; background: var(--brand-grad); color: var(--on-brand); font-size: .95rem; }
        .drawer-head p { margin: .375rem 0 0; color: var(--muted); font-size: .875rem; }
        .drawer-body { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem 1.5rem; }
        .drawer-foot { padding: 1rem 1.5rem; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: .625rem; }
        .drawer-foot .note { grid-column: 1 / -1; margin: 0; font-size: .78rem; color: var(--muted); text-align: center; }
        .set-group + .set-group { margin-top: 1.75rem; }
        .set-block + .set-block { margin-top: 1.125rem; }
        .set-block .field-label { margin-bottom: .5rem; }
        .set-block .segmented { min-height: 2.75rem; }
        .set-help { display: block; font-size: .78rem; color: var(--muted); margin-top: .375rem; }
        .set-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .875rem 0; cursor: pointer; }
        .set-row + .set-row { border-top: 1px solid var(--line); }
        .set-row strong { display: block; font-size: .9375rem; font-weight: 500; }
        .set-row small { display: block; font-size: .8rem; color: var(--muted); }

        .swatches { display: flex; flex-wrap: wrap; gap: .625rem; }
        .swatch { position: relative; }
        .swatch input { position: absolute; opacity: 0; pointer-events: none; }
        .swatch span { width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: #fff; font-size: .875rem; transition: transform .15s; }
        .swatch span i { opacity: 0; transition: opacity .15s; }
        .swatch input:checked + span { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--sw); }
        .swatch input:checked + span i { opacity: 1; }
        .swatch input:focus-visible + span { outline: 3px solid rgba(var(--brand-rgb), .55); outline-offset: 4px; }
        .swatch span:hover { transform: scale(1.08); }

        .switch { appearance: none; -webkit-appearance: none; width: 2.75rem; height: 1.5rem; border-radius: 999px; background: var(--line-2); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .2s; }
        .switch::before { content: ""; position: absolute; top: .1875rem; left: .1875rem; width: 1.125rem; height: 1.125rem; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
        .switch:checked { background: var(--brand-grad); }
        .switch:checked::before { transform: translateX(1.25rem); }

        /* Toast */
        .toast { position: fixed; left: 50%; bottom: 1.5rem; z-index: 100; transform: translate(-50%, 20px); background: var(--glass-strong); color: var(--ink); padding: .875rem 1.125rem; border-radius: 1rem; box-shadow: var(--shadow-lg); display: flex; gap: .625rem; align-items: center; max-width: calc(100% - 2rem); width: max-content; opacity: 0; visibility: hidden; transition: opacity .25s, transform .25s, visibility .25s; }
        .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
        .toast i { color: var(--brand); }

        /* Tool cards: real Start button, whole card clickable */
        .tool-card { position: relative; }
        .tool-btn { width: 100%; margin-top: .25rem; justify-content: space-between; }
        .tool-btn::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); }
        .tool-btn i { transition: transform .2s; }
        .tool-card:hover .tool-btn { background: var(--brand-grad); color: var(--on-brand); border-color: transparent; box-shadow: var(--brand-shadow); }
        .tool-card:hover .tool-btn i { transform: translateX(4px); }
        .tool-card.soon .tool-btn { background: var(--field); border-color: var(--line-2); color: var(--muted); }

        /* Home: 3D showcase */
        .showcase {
            display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: 1.5rem; align-items: center;
            padding: 1.75rem; border-radius: 1.75rem;
            background: linear-gradient(135deg, rgba(var(--brand-rgb), .14), rgba(var(--brand-rgb), .03)), var(--glass);
            -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border); box-shadow: var(--shadow-lg);
        }
        .showcase-text { padding: .5rem 1rem; }
        .showcase-text h2 { font-size: clamp(1.5rem, 2.8vw, 2.1rem); margin: .75rem 0 .5rem; line-height: 1.25; letter-spacing: -.01em; }
        .showcase-text > p { color: var(--ink-2); margin: 0 0 1rem; }
        .sc-list { list-style: none; padding: 0; margin: 0 0 1.5rem; display: grid; gap: .625rem; }
        .sc-list li { display: flex; gap: .75rem; align-items: center; font-size: .9375rem; }
        .sc-list i { width: 2rem; height: 2rem; flex: none; border-radius: .625rem; display: grid; place-items: center; background: var(--brand-50); color: var(--brand-ink); font-size: .85rem; }
        .showcase-demo { border-radius: 1.375rem; overflow: hidden; background: var(--glass-strong); border: 1px solid var(--glass-border); box-shadow: var(--shadow); }
        .showcase-demo .viz-stage { height: 21rem; }
        .demo-tabs { display: flex; gap: .375rem; padding: .625rem; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
        .demo-tabs::-webkit-scrollbar { display: none; }
        .demo-tabs button { flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .5rem .75rem; border-radius: .625rem; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: .8125rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
        .demo-tabs button:hover { color: var(--ink); background: var(--field); }
        .demo-tabs button[aria-selected="true"] { background: var(--brand-grad); color: var(--on-brand); box-shadow: var(--brand-shadow); }
        @media (max-width: 960px) {
            .showcase { grid-template-columns: 1fr; padding: 1rem; }
            .showcase-text { padding: .5rem; }
            .showcase-demo .viz-stage { height: 17rem; }
        }

        /* features: 4 tiles, 3D one highlighted */
        .features { grid-template-columns: repeat(auto-fit, minmax(13.5rem, 1fr)); }
        .feature-hl { position: relative; background: linear-gradient(135deg, rgba(var(--brand-rgb), .2), rgba(var(--brand-rgb), .06)), var(--glass); border-color: var(--brand-100); transition: transform .25s, box-shadow .25s; }
        .feature-hl:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .feature-hl .menu-icon { background: var(--brand-grad); color: var(--on-brand); box-shadow: var(--brand-shadow); }
        .feature-hl .badge { position: absolute; top: 1rem; right: 1rem; }

        /* Settings: site icon */
        .icon-setting { display: flex; gap: 1rem; align-items: center; padding: .875rem; border-radius: var(--radius-sm); background: var(--field); border: 1px solid var(--line); }
        .icon-preview { width: 3.75rem; height: 3.75rem; flex: none; border-radius: .875rem; display: grid; place-items: center; background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 50% / 12px 12px; border: 1px solid var(--line-2); }
        .icon-preview img { width: 2.25rem; height: 2.25rem; object-fit: contain; }
        .icon-meta { min-width: 0; }
        .icon-meta strong { display: block; font-size: .9375rem; font-weight: 600; }
        .icon-meta small { display: block; color: var(--muted); font-size: .8rem; }
        .icon-actions { display: flex; gap: .5rem; margin-top: .625rem; flex-wrap: wrap; }
        .icon-actions .btn { min-height: 2.25rem; padding: .375rem .75rem; font-size: .8125rem; }

        /* ===== WhatsApp / Gmail contact ===== */
        :root { --wa: #25d366; --wa-600: #1ebe5b; --gm: #ea4335; }
        .btn-wa { background: linear-gradient(135deg, var(--wa), var(--wa-600)); color: #fff; box-shadow: 0 10px 24px rgba(37, 211, 102, .3); }
        .btn-wa:hover { filter: brightness(1.05); transform: translateY(-1px); }
        .send-actions { flex-wrap: wrap; }
        .send-actions .btn { flex: 1 1 12rem; }
        .menu-icon.wa, .contact-card.wa .menu-icon { background: rgba(37, 211, 102, .14); color: #16a34a; }
        .menu-icon.gm, .contact-card.gm .menu-icon { background: rgba(234, 67, 53, .12); color: var(--gm); }
        [data-theme="dark"] .menu-icon.wa, [data-theme="dark"] .contact-card.wa .menu-icon { color: #4ade80; }
        .contact-cards { grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
        .contact-card em { display: block; font-style: normal; font-size: .8rem; color: var(--muted); word-break: break-word; }
        .contact-card.wa:hover { border-color: rgba(37, 211, 102, .45); }
        .contact-card.gm:hover { border-color: rgba(234, 67, 53, .35); }
        .wa-float {
            position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 45;
            width: 3.5rem; height: 3.5rem; border-radius: 50%;
            display: grid; place-items: center; color: #fff; font-size: 1.75rem;
            background: linear-gradient(135deg, var(--wa), var(--wa-600));
            box-shadow: 0 12px 28px rgba(37, 211, 102, .4);
            transition: transform .2s, box-shadow .2s;
        }
        .wa-float:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 16px 34px rgba(37, 211, 102, .5); }
        .wa-float::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 0 rgba(37, 211, 102, .5); animation: waPulse 2.4s infinite; }
        @keyframes waPulse { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, .45); } 70% { box-shadow: 0 0 0 16px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }
        @media (max-width: 560px) { .wa-float { right: 1rem; bottom: 1rem; width: 3.25rem; height: 3.25rem; font-size: 1.6rem; } }
        .socials a[hidden], [data-feature][hidden], .contact-card[hidden] { display: none !important; }

        /* ===== Announcement bar ===== */
        .announce {
            display: flex; align-items: center; gap: .75rem; margin-top: var(--gap);
            padding: .625rem .75rem .625rem 1.125rem; border-radius: var(--radius);
            background: linear-gradient(135deg, rgba(var(--brand-rgb), .18), rgba(var(--brand-rgb), .06)), var(--glass-strong);
            -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
            border: 1px solid var(--brand-100); color: var(--ink); font-size: .9rem; font-weight: 500;
        }
        .announce[hidden] { display: none; }
        .announce > i { color: var(--brand-ink); }
        .announce > span { flex: 1; }

        /* ===== Login modal ===== */
        .modal {
            position: fixed; left: 50%; top: 50%; z-index: 90;
            width: min(25rem, calc(100% - 2rem)); max-height: calc(100vh - 2rem); overflow-y: auto;
            transform: translate(-50%, -46%) scale(.98); opacity: 0; visibility: hidden;
            border-radius: 1.5rem; background: var(--glass-strong);
            -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border); box-shadow: var(--shadow-lg);
            transition: transform .25s, opacity .25s, visibility .25s;
        }
        .modal.open { transform: translate(-50%, -50%); opacity: 1; visibility: visible; }
        .modal-head { display: flex; align-items: flex-start; gap: .875rem; padding: 1.5rem 1.5rem 0; }
        .modal-head > div { flex: 1; }
        .modal-head h2 { margin: 0; font-size: 1.25rem; }
        .modal-head p { margin: .25rem 0 0; color: var(--muted); font-size: .875rem; }
        .modal-icon { width: 2.75rem; height: 2.75rem; flex: none; border-radius: .875rem; display: grid; place-items: center; background: var(--brand-grad); color: var(--on-brand); box-shadow: var(--brand-shadow); }
        .modal-body { padding: 1.25rem 1.5rem 1.5rem; display: grid; gap: 1rem; }
        .modal-body .hint { margin: 0; }
        .pass-wrap { position: relative; }
        .pass-wrap .control { padding-right: 3rem; }
        .pass-toggle { position: absolute; right: .375rem; top: 50%; transform: translateY(-50%); width: 2.25rem; height: 2.25rem; border: 0; border-radius: .5rem; background: transparent; color: var(--muted); cursor: pointer; }
        .pass-toggle:hover { color: var(--brand-ink); background: var(--brand-50); }
        .form-error { margin: 0; min-height: 1.2em; color: var(--err); font-size: .85rem; }
        .form-error:empty { display: none; }
        .link-btn { background: none; border: 0; padding: .25rem; color: var(--brand-ink); font-weight: 500; font-size: .875rem; cursor: pointer; justify-self: center; }
        .link-btn:hover { text-decoration: underline; }
        #login-scrim { z-index: 85; }

        /* ===== Admin dashboard ===== */
        .muted { color: var(--muted); }
        .admin-bar { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .5rem; margin-bottom: var(--gap); flex-wrap: wrap; }
        .admin-tabs { display: flex; gap: .25rem; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1 1 auto; }
        .admin-tabs::-webkit-scrollbar { display: none; }
        .admin-tabs button { display: inline-flex; align-items: center; gap: .5rem; padding: .625rem .9rem; border: 0; border-radius: .75rem; background: transparent; color: var(--muted); font-size: .875rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
        .admin-tabs button:hover { background: var(--field); color: var(--ink); }
        .admin-tabs button[aria-selected="true"] { background: var(--brand-grad); color: var(--on-brand); box-shadow: var(--brand-shadow); }
        .tab-count { min-width: 1.25rem; height: 1.25rem; padding: 0 .35rem; border-radius: 999px; background: var(--err); color: #fff; font-size: .7rem; display: inline-grid; place-items: center; }
        .admin-user { display: flex; align-items: center; gap: .625rem; padding-right: .25rem; }
        .admin-who { display: inline-flex; align-items: center; gap: .4rem; color: var(--muted); font-size: .8125rem; max-width: 16rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .admin-who i { color: var(--brand-ink); }
        .admin-panel[hidden] { display: none; }
        .admin-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); margin-bottom: var(--gap); }
        .admin-stats strong { font-size: 1.5rem !important; }
        @media (max-width: 1100px) { .admin-stats { grid-template-columns: 1fr 1fr; } }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1rem 1.5rem; }
        .admin-grid .set-block + .set-block { margin-top: 0; }
        .admin-switches, .toggle-grid { margin-top: 1rem; }
        .toggle-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); column-gap: 1.5rem; }
        .toggle-grid .set-row + .set-row { border-top: 0; }
        .toggle-grid .set-row { border-bottom: 1px solid var(--line); }
        .admin-panel .set-help { margin-top: .5rem; }
        .card-head small { font-size: .78rem; }

        .msg-list { display: grid; gap: .625rem; }
        .msg { padding: .875rem 1rem; border-radius: var(--radius-sm); background: var(--field); border: 1px solid var(--line); }
        .msg-top { display: flex; justify-content: space-between; gap: .75rem; align-items: baseline; flex-wrap: wrap; }
        .msg-top strong { font-size: .95rem; }
        .msg-top time { color: var(--muted); font-size: .75rem; }
        .msg-meta { color: var(--muted); font-size: .8rem; margin-top: .125rem; word-break: break-word; }
        .msg-body { margin: .5rem 0 0; font-size: .9rem; white-space: pre-wrap; word-break: break-word; }
        .msg-stars { color: #f5b301; font-size: .8rem; letter-spacing: .1em; }
        .msg-kind { font-size: .7rem; font-weight: 600; padding: .1rem .5rem; border-radius: 999px; background: var(--brand-50); color: var(--brand-ink); margin-left: .375rem; }
        .msg-actions { display: flex; gap: .375rem; margin-top: .625rem; flex-wrap: wrap; }
        .msg-actions .btn { min-height: 2rem; padding: .3rem .7rem; font-size: .78rem; border-radius: .625rem; }
        .msg-empty { color: var(--muted); text-align: center; padding: 1.5rem .5rem; font-size: .9rem; }

        /* About: single card */
        .about-wrap { max-width: 40rem; margin: 0 auto; }
        .about-wrap.two { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: var(--gap); align-items: start; }
        @media (max-width: 1100px) { .about-wrap.two { grid-template-columns: 1fr; } }
        .avatar { overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .info-list .v { font-weight: 500; }
        .msg-cols { grid-template-columns: 1fr 1fr; }
        @media (max-width: 1100px) { .msg-cols { grid-template-columns: 1fr; } }

        /* Admin → Developer */
        .dev-photo { width: 4.5rem; height: 4.5rem; flex: none; border-radius: 1.25rem; overflow: hidden; display: grid; place-items: center; background: var(--brand-grad); color: var(--on-brand); font-weight: 700; font-size: 1.4rem; box-shadow: var(--brand-shadow); }
        .dev-photo img { width: 100%; height: 100%; object-fit: cover; }
        .extra-list { display: grid; gap: .625rem; margin-bottom: .75rem; }
        .extra-row { display: grid; grid-template-columns: 8.5rem repeat(2, minmax(0, 1fr)) minmax(0, 1.2fr) minmax(0, 1.2fr) auto; gap: .5rem; align-items: center; padding: .625rem; border-radius: var(--radius-sm); background: var(--field); border: 1px solid var(--line); }
        .extra-row .control { min-height: 2.5rem; padding: .5rem .7rem; font-size: .875rem; }
        .extra-row select.control { padding-right: .4rem; }
        .icon-btn.danger { color: var(--err); }
        .icon-btn.danger:hover { background: var(--err-bg); border-color: rgba(229, 72, 77, .35); color: var(--err); }
        @media (max-width: 900px) { .extra-row { grid-template-columns: 1fr 1fr; } .extra-row .icon-btn { justify-self: end; } }
        .dev-actions { flex-wrap: wrap; }
        .dev-actions .btn-primary { flex: 1 1 14rem; }

        /* Floating contact dock (WhatsApp + Gmail) */
        .contact-dock { position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 45; display: flex; flex-direction: column; align-items: flex-end; gap: .75rem; }
        .dock-btn {
            position: relative; width: 3.5rem; height: 3.5rem; border-radius: 50%;
            display: grid; place-items: center; color: #fff; font-size: 1.65rem;
            transition: transform .2s, box-shadow .2s;
        }
        .dock-btn.wa { background: linear-gradient(135deg, var(--wa), var(--wa-600)); box-shadow: 0 12px 28px rgba(37, 211, 102, .4); }
        .dock-btn.wa::after { content: ""; position: absolute; inset: 0; border-radius: 50%; animation: waPulse 2.4s infinite; }
        .dock-btn.gm { width: 3rem; height: 3rem; font-size: 1.2rem; color: var(--gm); background: var(--glass-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-border); box-shadow: var(--shadow-lg); margin-right: .25rem; }
        .dock-btn:hover { transform: translateY(-3px) scale(1.05); }
        .dock-tip {
            position: absolute; right: calc(100% + .75rem); top: 50%; transform: translate(6px, -50%);
            white-space: nowrap; font-size: .8125rem; font-weight: 500; padding: .4rem .75rem; border-radius: .625rem;
            background: var(--glass-strong); color: var(--ink); border: 1px solid var(--glass-border); box-shadow: var(--shadow);
            -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
            opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
        }
        .dock-btn:hover .dock-tip, .dock-btn:focus-visible .dock-tip { opacity: 1; transform: translate(0, -50%); }
        @media (hover: none) { .dock-tip { display: none; } }
        @media (max-width: 560px) {
            .contact-dock { right: 1rem; bottom: 1rem; gap: .625rem; }
            .dock-btn { width: 3.25rem; height: 3.25rem; font-size: 1.5rem; }
            .dock-btn.gm { width: 2.75rem; height: 2.75rem; font-size: 1.1rem; }
        }
        body[data-page="admin"] .contact-dock { display: none !important; }
        @media print { .contact-dock { display: none !important; } }

        /* ===== Tiles calculator ===== */
        .area-list { display: grid; gap: .75rem; margin-bottom: .75rem; }
        .area-row { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) auto; gap: .75rem; align-items: start; padding: .75rem; border-radius: var(--radius-sm); background: var(--field); border: 1px solid var(--line); }
        .area-no { min-width: 4.5rem; height: 3rem; margin-top: 1.7rem; display: grid; place-items: center; padding: 0 .5rem; border-radius: .75rem; background: var(--brand-50); color: var(--brand-ink); font-weight: 600; font-size: .85rem; white-space: nowrap; }
        .area-row .icon-btn { margin-top: 1.95rem; }
        @media (max-width: 1240px) {
            .area-row { grid-template-columns: minmax(0, 1fr) auto; }
            .area-no { grid-row: 1; grid-column: 1; height: auto; margin-top: 0; padding: .25rem .6rem; justify-self: start; min-width: 0; }
            .area-row .icon-btn { grid-row: 1; grid-column: 2; margin-top: 0; justify-self: end; }
            .area-row .field { grid-column: 1 / -1; }
        }
        .opt { color: var(--muted); font-weight: 400; font-size: .78rem; }
        .tile-presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.25rem, 1fr)); gap: .5rem; }
        .tile-presets label { position: relative; }
        .tile-presets input { position: absolute; opacity: 0; pointer-events: none; }
        .tile-presets label > span { display: flex; flex-direction: column; align-items: center; gap: .4rem; padding: .75rem .5rem; border-radius: .875rem; border: 1px solid var(--line-2); background: var(--field); cursor: pointer; font-size: .85rem; transition: border-color .15s, background .15s, box-shadow .15s; }
        .tile-presets label > span:hover { border-color: var(--brand-100); }
        .tile-presets b { font-weight: 600; }
        .tile-presets .tp { display: block; height: 1.6rem; width: calc(1.6rem * var(--a) / var(--b)); max-width: 3rem; border-radius: 3px; background: linear-gradient(135deg, var(--brand-50), var(--brand-100)); border: 1.5px solid var(--brand); }
        .tile-presets .fa-pen-ruler { font-size: 1.25rem; height: 1.6rem; display: grid; place-items: center; color: var(--brand-ink); }
        .tile-presets input:checked + span { border-color: var(--brand); background: var(--brand-50); box-shadow: 0 0 0 3px rgba(var(--brand-rgb), .15); color: var(--brand-ink); }
        .tile-presets input:focus-visible + span { outline: 3px solid rgba(var(--brand-rgb), .55); }
        .tile-custom { margin-top: 1rem; }
        .formula { margin-top: .875rem; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--field); }
        .formula summary { cursor: pointer; padding: .75rem .875rem; font-weight: 600; font-size: .9rem; color: var(--brand-ink); list-style: none; display: flex; align-items: center; gap: .5rem; }
        .formula summary::-webkit-details-marker { display: none; }
